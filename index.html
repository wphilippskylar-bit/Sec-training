<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Security+ SY0-701 Practice Console</title>
<style>
  :root{
    --bg: #0a0e13;
    --panel: #10161d;
    --panel-2: #151d26;
    --line: #223041;
    --text: #d7e2ea;
    --text-dim: #7d93a3;
    --accent: #2dd9c4;
    --accent-dim: #1a8b7c;
    --amber: #f2b84b;
    --red: #ef6a6a;
    --green: #57d38c;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); min-height:100vh;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(45,217,196,0.06), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(242,184,75,0.05), transparent 40%);
  }
  .wrap{max-width:820px; margin:0 auto; padding:28px 18px 60px;}
  .console-header{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:22px;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .tag{font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--accent); text-transform:uppercase;}
  .brand h1{margin:0; font-size:20px; font-weight:600; letter-spacing:0.2px;}
  .status-dot{width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); display:inline-block; margin-right:6px;}
  .pill{
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    border:1px solid var(--line); border-radius:20px; padding:5px 12px;
    display:flex; align-items:center;
  }
  .timer-pill{
    font-size:13px; font-weight:700; color:var(--accent); border-color:var(--accent-dim);
    background:rgba(45,217,196,0.08); padding:5px 14px;
  }
  .timer-pill.timer-low{color:var(--red); border-color:var(--red); background:rgba(239,106,106,0.1); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.55;}}

  /* Domain meter */
  .domain-meter{display:flex; gap:3px; height:8px; border-radius:4px; overflow:hidden; margin:18px 0 6px;}
  .domain-meter div{height:100%;}
  .domain-legend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:11px; font-family:var(--mono); color:var(--text-dim); margin-bottom:28px;}
  .domain-legend span.sw{width:9px; height:9px; display:inline-block; border-radius:2px; margin-right:5px; vertical-align:middle;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px; margin-bottom:16px;}
  .card h2{margin-top:0; font-size:16px; font-weight:600;}
  .muted{color:var(--text-dim); font-size:13px; line-height:1.6;}

  .mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
  @media (max-width:560px){ .mode-grid{grid-template-columns:1fr;} }
  .mode-btn{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:14px; text-align:left; cursor:pointer; color:var(--text); font-family:var(--sans);
    transition:border-color .15s, transform .15s;
  }
  .mode-btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .mode-btn .m-title{font-weight:600; font-size:14px; margin-bottom:4px;}
  .mode-btn .m-sub{font-size:11px; color:var(--text-dim); font-family:var(--mono);}

  .history-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .history-row:last-child{border-bottom:none;}
  .history-score{font-family:var(--mono); font-weight:600;}
  .history-score.good{color:var(--green);}
  .history-score.mid{color:var(--amber);}
  .history-score.bad{color:var(--red);}

  /* Quiz view */
  .progress-bar{height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-bottom:18px;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--accent-dim), var(--accent)); transition:width .3s;}
  .q-meta{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .q-num{font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .q-domain-badge{
    font-family:var(--mono); font-size:10px; letter-spacing:0.5px; text-transform:uppercase;
    padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--text-dim);
  }
  .q-text{font-size:16px; line-height:1.55; margin:6px 0 18px; font-weight:500;}
  .choice{
    display:block; width:100%; text-align:left; background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:9px;
    color:var(--text); font-family:var(--sans); font-size:14px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .choice:hover:not(:disabled){border-color:var(--accent);}
  .choice:disabled{cursor:default;}
  .choice .letter{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:5px; background:var(--bg);
    font-family:var(--mono); font-size:11px; margin-right:10px; color:var(--text-dim);
  }
  .choice.correct{border-color:var(--green); background:rgba(87,211,140,0.08);}
  .choice.correct .letter{background:var(--green); color:#062b1a;}
  .choice.incorrect{border-color:var(--red); background:rgba(239,106,106,0.08);}
  .choice.incorrect .letter{background:var(--red); color:#2b0808;}

  .feedback{
    margin-top:16px; padding:14px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); font-size:13px; line-height:1.6;
  }
  .feedback.right{border-color:var(--green);}
  .feedback.wrong{border-color:var(--red);}
  .feedback .verdict{font-weight:700; font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; display:block;}
  .feedback.right .verdict{color:var(--green);}
  .feedback.wrong .verdict{color:var(--red);}
  .resource-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12px;
    color:var(--accent); text-decoration:none; border-bottom:1px dashed var(--accent-dim);
  }
  .resource-link:hover{color:#fff;}

  .btn{
    font-family:var(--sans); font-weight:600; font-size:14px; border:none; border-radius:8px;
    padding:11px 20px; cursor:pointer; transition:opacity .15s;
  }
  .btn:hover{opacity:0.88;}
  .btn-primary{background:var(--accent); color:#04211d;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn-row{display:flex; justify-content:space-between; align-items:center; margin-top:16px;}

  /* Results */
  .score-hero{text-align:center; padding:28px 10px 8px;}
  .score-hero .big{font-family:var(--mono); font-size:52px; font-weight:700; color:var(--accent);}
  .score-hero .label{color:var(--text-dim); font-size:13px; margin-top:4px;}
  .domain-breakdown{margin-top:20px;}
  .db-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12px;}
  .db-name{width:190px; flex-shrink:0; color:var(--text-dim); font-family:var(--mono); font-size:11px;}
  .db-track{flex:1; height:7px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
  .db-fill{height:100%; background:var(--accent);}
  .db-fill.weak{background:var(--red);}
  .db-fill.mid{background:var(--amber);}
  .db-pct{width:44px; text-align:right; font-family:var(--mono); color:var(--text-dim); font-size:11px;}

  .review-item{border-bottom:1px solid var(--line); padding:14px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-q{font-size:13px; font-weight:600; margin-bottom:6px;}
  .review-tag{font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:10px; margin-right:8px;}
  .review-tag.right{background:rgba(87,211,140,0.15); color:var(--green);}
  .review-tag.wrong{background:rgba(239,106,106,0.15); color:var(--red);}

  .footer-note{text-align:center; color:var(--text-dim); font-size:11px; margin-top:30px; font-family:var(--mono);}
  select{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:8px 10px; font-family:var(--sans); font-size:13px;
  }
  a{color:var(--accent);}

  /* ===== Tabs + Dion analysis / weak spots ===== */
  .tabs{display:flex; gap:6px; margin:-8px 0 22px; flex-wrap:wrap;}
  .tab-btn{background:var(--panel); border:1px solid var(--line); color:var(--text-dim); font-family:var(--mono); font-size:12px; letter-spacing:.5px; padding:8px 14px; border-radius:20px; cursor:pointer;}
  .tab-btn:hover{border-color:var(--accent); color:var(--text);}
  .tab-btn.active{background:rgba(45,217,196,0.1); border-color:var(--accent); color:var(--accent);}
  .tbl-wrap{overflow-x:auto; margin-top:10px;}
  table.dt{width:100%; border-collapse:collapse; font-size:13px;}
  table.dt th{font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.dt td{padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45;}
  table.dt tr:last-child td{border-bottom:none;}
  table.dt td.mono{font-family:var(--mono); white-space:nowrap;}
  table.dt tr.hot td{background:rgba(242,184,75,0.06);}
  .flag{font-family:var(--mono); font-size:9px; color:var(--amber); border:1px solid rgba(242,184,75,.5); border-radius:8px; padding:1px 6px; margin-left:6px; white-space:nowrap;}
  .pct-good{color:var(--green);} .pct-mid{color:var(--amber);} .pct-bad{color:var(--red);}
  ol.fix{padding-left:20px; margin:8px 0 0;} ol.fix li{margin-bottom:10px; font-size:13px; line-height:1.55;}
  ol.fix li b{color:var(--text);}
  ul.tight{padding-left:18px; margin:8px 0 0;} ul.tight li{font-size:13px; line-height:1.55; margin-bottom:8px;}
  .attempt-bars{display:flex; align-items:flex-end; gap:4px; height:auto; margin:22px 0 4px; position:relative;}
  .attempt-bars .ab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .attempt-bars .ab .bw{height:80px; width:100%; display:flex; align-items:flex-end; justify-content:center;}
  .attempt-bars .ab .bar{width:100%; max-width:46px; border-radius:4px 4px 0 0; background:var(--accent-dim);}
  .attempt-bars .ab .v{font-family:var(--mono); font-size:11px; margin-bottom:4px;}
  .attempt-bars .ab .l{font-family:var(--mono); font-size:9px; color:var(--text-dim); margin-top:4px; height:28px; text-align:center; line-height:1.3;}
  .pass-line{position:absolute; left:0; right:0; border-top:1px dashed var(--amber);}
  .pass-line span{position:absolute; right:0; top:-15px; font-family:var(--mono); font-size:9px; color:var(--amber);}
  details.vset{border:1px solid var(--line); border-radius:8px; margin-bottom:10px; background:var(--panel-2);}
  details.vset summary{cursor:pointer; padding:12px 14px; font-weight:600; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:10px; list-style:none;}
  details.vset summary::-webkit-details-marker{display:none;}
  details.vset summary .sub{font-family:var(--mono); font-size:10px; color:var(--text-dim); font-weight:400;}
  details.vset .inner{padding:0 14px 14px;}
  .tell{font-family:var(--mono); font-size:11px; color:var(--accent);}
  .btn-sm{font-size:12px; padding:7px 12px;}
  .flashcard{min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; padding:30px 20px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; user-select:none;}
  .flashcard .term{font-size:22px; font-weight:600;}
  .flashcard .def{font-size:15px; line-height:1.6; margin-top:14px;}
  .flashcard .hint{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:18px;}
  .flashcard .setname{font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); margin-bottom:14px;}
  .attempt-bars .ab .bw{position:relative;}
  .newdot{position:absolute; left:50%; width:9px; height:9px; margin-left:-4.5px; margin-bottom:-4.5px; border-radius:50%; background:var(--amber); border:2px solid var(--bg);}
  .legend-row{display:flex; gap:16px; flex-wrap:wrap; font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:8px;}
  .legend-row .sw{width:9px; height:9px; display:inline-block; border-radius:2px; margin-right:5px; vertical-align:middle;}
  .dotkey{width:9px; height:9px; display:inline-block; border-radius:50%; background:var(--amber); margin-right:5px; vertical-align:middle;}
  .optx{margin-top:6px;}
  .ox{border-left:3px solid var(--line); padding:8px 10px; margin:8px 0; background:rgba(0,0,0,0.12); border-radius:0 6px 6px 0;}
  .ox.ok{border-left-color:var(--green);} .ox.bad{border-left-color:var(--red);}
  .ox-h{font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .ox-h .letter{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px; background:var(--bg); font-family:var(--mono); font-size:10px; color:var(--text-dim);}
  .ox-tag{font-family:var(--mono); font-size:9px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-dim); border:1px solid var(--line); border-radius:8px; padding:1px 6px;}
  .ox-tag.ok{color:var(--green); border-color:rgba(87,211,140,.5);} .ox-tag.bad{color:var(--red); border-color:rgba(239,106,106,.5);}
  .ox-e{font-size:13px; line-height:1.55; color:var(--text-dim); margin-top:4px;}
  .mastery-row{display:flex; align-items:center; gap:10px; font-size:12px; margin-bottom:8px;}
  .mastery-row .nm{width:150px; flex-shrink:0; font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .obj-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px;}
  .obj-btn{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:9px 10px; text-align:left; color:var(--text); cursor:pointer; font-size:12px;}
  .obj-btn:hover{border-color:var(--accent);}
  .obj-btn .on{font-family:var(--mono); font-weight:700; color:var(--accent); margin-right:6px;}
  .obj-btn .os{display:block; font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:3px;}
  .pick-note{font-size:12px; color:var(--amber); font-family:var(--mono); display:block; margin-bottom:6px;}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sec+ Console">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>

<script>
const QUESTION_BANK = [{"domain": "1.0 General Security Concepts", "question": "A company posts a sign at the building entrance warning that all visitors must sign in at the front desk. What type of security control is this?", "choices": ["Deterrent", "Detective", "Compensating", "Corrective"], "correct": 0, "explanation": "A deterrent control discourages someone from attempting a violation before it happens (a warning sign, lighting, or posted policy). It doesn't stop the action directly like a preventive control, and it doesn't detect or fix anything after the fact.", "resource": {"label": "Security Controls (SY0-701 1.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/security-controls-sy0-701/"}}, {"domain": "1.0 General Security Concepts", "question": "A security team implements a policy requiring two separate employees to approve any wire transfer over $10,000. Which security concept does this best illustrate?", "choices": ["Separation of duties", "Non-repudiation", "Least privilege", "Job rotation"], "correct": 0, "explanation": "Separation of duties splits a sensitive task among multiple people so no single person can complete a fraudulent action alone. It reduces insider-threat risk by requiring collusion for an attack to succeed.", "resource": {"label": "Security Controls (SY0-701 1.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/security-controls-sy0-701/"}}, {"domain": "1.0 General Security Concepts", "question": "Which element of the CIA triad ensures that data has not been altered by an unauthorized party?", "choices": ["Confidentiality", "Integrity", "Availability", "Accounting"], "correct": 1, "explanation": "Integrity guarantees that data is accurate and hasn't been modified without authorization, often verified with hashing. Confidentiality protects data from unauthorized viewing, and availability ensures authorized users can access it when needed.", "resource": {"label": "The CIA Triad (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "A digitally signed document allows a recipient to prove that a specific sender created it and that the sender cannot later deny sending it. What security concept does this describe?", "choices": ["Authorization", "Non-repudiation", "Obfuscation", "Redundancy"], "correct": 1, "explanation": "Non-repudiation uses cryptographic proof, typically a digital signature, so the sender cannot credibly deny having sent a message. This relies on the sender's private key, which only they should possess.", "resource": {"label": "Non-Repudiation (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "An organization wants every access request, whether from inside or outside the network, to be authenticated and authorized before granting access to any resource. Which security model is being implemented?", "choices": ["Defense in depth", "Zero trust", "Security through obscurity", "Air gapping"], "correct": 1, "explanation": "Zero trust assumes no user or device is inherently trusted, so every request is verified regardless of network location. It relies on policy enforcement points and continuous validation rather than a trusted internal network perimeter.", "resource": {"label": "Zero Trust (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/zero-trust-sy0-701/"}}, {"domain": "1.0 General Security Concepts", "question": "In a zero trust architecture, which component evaluates a request against policy and makes the final decision to allow or deny access?", "choices": ["Policy enforcement point", "Policy decision point", "Subject", "Data plane"], "correct": 1, "explanation": "The policy decision point evaluates trust and access policies to decide whether a request is approved, while the policy enforcement point carries out that decision by allowing or blocking the connection.", "resource": {"label": "Zero Trust (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/zero-trust-sy0-701/"}}, {"domain": "1.0 General Security Concepts", "question": "A company installs bollards in front of its main entrance. What is the primary purpose of this physical security control?", "choices": ["Detect unauthorized entry attempts", "Prevent vehicles from ramming the building", "Record visitor identities", "Provide emergency lighting"], "correct": 1, "explanation": "Bollards are sturdy vertical posts designed to stop vehicles from crashing into a building or pedestrian area. They are a preventive physical control against vehicle-based attacks, not a detection or identification mechanism.", "resource": {"label": "Physical Security (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "A network defender deploys a server with fake financial records that appears identical to a production system in order to study attacker behavior. What is this technique called?", "choices": ["Honeypot", "Sandbox", "DMZ", "Air gap"], "correct": 0, "explanation": "A honeypot is a decoy system designed to look like a legitimate target, luring attackers away from real assets while allowing defenders to observe and analyze their tactics. A sandbox is used to safely execute and analyze suspicious code, not to lure attackers.", "resource": {"label": "Honeypots and Deception Technology (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "Before making a change to a production firewall, an administrator submits a request describing the change, its risk, and a rollback plan, and waits for approval from a change advisory board. What process is being followed?", "choices": ["Incident response", "Change management", "Vulnerability scanning", "Business continuity planning"], "correct": 1, "explanation": "Change management is the formal process of documenting, reviewing, approving, and testing changes before implementation, reducing the risk of unplanned outages. A rollback plan and impact analysis are standard parts of this process.", "resource": {"label": "Change Management (SY0-701 1.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "Which cryptographic concept ensures that if a long-term private key is ever compromised, previously captured encrypted sessions cannot be decrypted?", "choices": ["Key stretching", "Perfect forward secrecy", "Key escrow", "Salting"], "correct": 1, "explanation": "Perfect forward secrecy generates unique, ephemeral session keys for each session so that compromising one key (even a long-term private key) doesn't expose past communications. Protocols like TLS use Diffie-Hellman ephemeral (DHE/ECDHE) exchanges to achieve this.", "resource": {"label": "Cryptographic Solutions (SY0-701 1.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "A company stores a copy of its data encryption keys with a trusted third party in case the original keys are lost. What is this practice called?", "choices": ["Key stretching", "Key escrow", "Obfuscation", "Steganography"], "correct": 1, "explanation": "Key escrow is the practice of storing a copy of cryptographic keys with a trusted third party so data can still be recovered if the original key is lost or an authorized party (such as law enforcement) needs access under proper authority.", "resource": {"label": "Cryptographic Solutions (SY0-701 1.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A former employee with deep knowledge of internal systems launches an attack against their old employer's network. Which threat actor category best describes this person?", "choices": ["Nation-state actor", "Insider threat", "Hacktivist", "Script kiddie"], "correct": 1, "explanation": "An insider threat comes from someone who has (or had) legitimate access to systems, such as a current or former employee. Their internal knowledge often makes them more dangerous than an external attacker with no prior access.", "resource": {"label": "Threat Actors (SY0-701 2.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker gains unauthorized access to a healthcare provider's database and threatens to publish patient records unless a ransom is paid, primarily motivated by financial gain. Which motivation best fits this attacker?", "choices": ["Ethical / conscientious objection", "Financial gain", "Political / geopolitical", "Revenge"], "correct": 1, "explanation": "Financially motivated attackers pursue direct monetary gain, commonly through ransomware, data theft, and extortion. Political or ethical hackers (hacktivists) instead act to advance a cause or expose wrongdoing, not for direct profit.", "resource": {"label": "Threat Actor Motivations (SY0-701 2.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Which term describes the sum of all points where an unauthorized user could attempt to enter or extract data from a system?", "choices": ["Threat vector", "Attack surface", "Vulnerability", "Exploit"], "correct": 1, "explanation": "The attack surface is the total set of entry points, open ports, exposed services, and interfaces that could potentially be attacked. A threat vector is the specific path or method an attacker actually uses to gain access.", "resource": {"label": "Attack Surface (SY0-701 2.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker convinces a help desk employee over the phone to reset a user's password by pretending to be that user. What social engineering technique is this?", "choices": ["Pretexting", "Tailgating", "Watering hole attack", "Typosquatting"], "correct": 0, "explanation": "Pretexting is a social engineering technique where the attacker fabricates a believable scenario (a false identity or story) to manipulate a target into divulging information or performing an action. Tailgating involves physically following someone into a secure area.", "resource": {"label": "Social Engineering (SY0-701 2.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A malicious actor compromises a website that employees of a specific target organization frequently visit, hoping employees will become infected when they browse it. What is this attack called?", "choices": ["Watering hole attack", "Business email compromise", "Credential stuffing", "Vishing"], "correct": 0, "explanation": "A watering hole attack compromises a legitimate site that a specific target group is known to visit, infecting visitors from that group rather than attacking the target directly. It relies on the trust the victims already have in the compromised site.", "resource": {"label": "Social Engineering (SY0-701 2.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Malware that appears to be legitimate software but secretly performs malicious actions once installed, without self-replicating, is best classified as which type of malware?", "choices": ["Worm", "Trojan", "Logic bomb", "Rootkit"], "correct": 1, "explanation": "A Trojan disguises itself as legitimate or desirable software to trick users into installing it, then carries out malicious activity. Unlike a worm, a Trojan does not self-replicate across a network on its own.", "resource": {"label": "Malware Types (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Malicious code configured to activate and delete files only when a specific employee's account is removed from the payroll system is an example of what?", "choices": ["Logic bomb", "Rootkit", "Spyware", "Worm"], "correct": 0, "explanation": "A logic bomb is malicious code that lies dormant until a specific condition or trigger occurs, such as a date, event, or an account being deleted. It is often planted by an insider as a form of retaliation.", "resource": {"label": "Malware Types (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Which type of malware is specifically designed to hide its presence and maintain privileged access to a system by modifying the operating system's core functions?", "choices": ["Rootkit", "Adware", "Keylogger", "Ransomware"], "correct": 0, "explanation": "A rootkit embeds itself at a low level (often the kernel) to hide its own processes, files, and network connections while maintaining administrator-level access. This makes rootkits especially difficult to detect with standard tools.", "resource": {"label": "Malware Types (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An application accepts user input directly into a SQL query without sanitizing it, allowing an attacker to manipulate the underlying database. This is an example of which vulnerability?", "choices": ["Buffer overflow", "SQL injection", "Cross-site scripting", "Directory traversal"], "correct": 1, "explanation": "SQL injection occurs when untrusted input is inserted directly into a database query, letting an attacker alter the query's logic to read, modify, or delete data. Proper input validation and parameterized queries prevent this class of vulnerability.", "resource": {"label": "Application Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker sends more data to a program's input buffer than it was designed to hold, overwriting adjacent memory and potentially executing arbitrary code. What is this attack called?", "choices": ["Buffer overflow", "Race condition", "Replay attack", "Pass the hash"], "correct": 0, "explanation": "A buffer overflow occurs when data exceeds the allocated memory buffer, corrupting adjacent memory and sometimes allowing an attacker to execute injected code. Proper bounds checking and memory-safe languages help mitigate this.", "resource": {"label": "Application Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Two threads access and modify a shared bank account balance at nearly the same time, and due to the timing, the final balance is calculated incorrectly. What type of vulnerability does this describe?", "choices": ["Race condition", "Memory leak", "Integer overflow", "Cross-site request forgery"], "correct": 0, "explanation": "A race condition occurs when the outcome of a process depends on the timing of uncontrolled events, such as two threads accessing shared data simultaneously without proper synchronization, leading to unexpected or exploitable behavior.", "resource": {"label": "Application Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker floods a target web server with an overwhelming volume of traffic from thousands of compromised IoT devices simultaneously. What type of attack is this?", "choices": ["Distributed denial-of-service (DDoS)", "On-path attack", "DNS poisoning", "ARP spoofing"], "correct": 0, "explanation": "A distributed denial-of-service attack uses many compromised devices (a botnet) across different locations to flood a target with traffic, overwhelming its resources and making services unavailable to legitimate users.", "resource": {"label": "Network Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker intercepts communication between a user and a legitimate website, secretly relaying and possibly altering messages between them without either party's knowledge. What is this attack called?", "choices": ["On-path attack", "Smishing", "Credential stuffing", "Pharming"], "correct": 0, "explanation": "An on-path attack (formerly called man-in-the-middle) positions the attacker between two communicating parties so they can eavesdrop on or alter traffic in transit, often by exploiting ARP spoofing or a rogue access point.", "resource": {"label": "Network Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker obtains a list of previously breached username and password pairs and automatically tries them against many other websites, hoping users reused credentials. What is this attack called?", "choices": ["Credential stuffing", "Password spraying", "Brute force", "Rainbow table attack"], "correct": 0, "explanation": "Credential stuffing uses lists of already-compromised username/password pairs (often from prior breaches) against other sites, exploiting the fact that many people reuse passwords across services. Password spraying instead tries a few common passwords across many accounts.", "resource": {"label": "Password Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Which password attack tries a small number of commonly used passwords against a large number of different user accounts, in order to avoid triggering account lockout policies?", "choices": ["Password spraying", "Dictionary attack", "Rainbow table attack", "Credential stuffing"], "correct": 0, "explanation": "Password spraying tests one or a few common passwords across many accounts rather than many passwords against one account, keeping attempts per account low enough to stay under typical lockout thresholds.", "resource": {"label": "Password Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A security analyst notices a sudden, unexplained spike in outbound traffic to an unfamiliar external IP address late at night from a server that normally has no external connections. What should this be treated as?", "choices": ["A normal baseline pattern", "An indicator of compromise", "A false positive requiring no action", "A scheduled maintenance window"], "correct": 1, "explanation": "Unusual outbound traffic to an unfamiliar destination, especially outside normal hours, is a classic indicator of compromise (IoC) that may signal data exfiltration or command-and-control activity, and it warrants investigation.", "resource": {"label": "Indicators of Compromise (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A vulnerability that is exploited by attackers before the software vendor becomes aware of it or releases a patch is known as what?", "choices": ["Zero-day vulnerability", "Legacy vulnerability", "Misconfiguration", "Supply chain vulnerability"], "correct": 0, "explanation": "A zero-day vulnerability is one that is unknown to the vendor (or unpatched) at the time it is actively exploited, giving defenders zero days of advance warning to fix it before attacks occur.", "resource": {"label": "Vulnerability Types (SY0-701 2.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A company continues running an unsupported operating system that no longer receives security patches because a critical business application depends on it. What type of vulnerability does this represent?", "choices": ["Zero-day vulnerability", "Legacy platform vulnerability", "Race condition", "Buffer overflow"], "correct": 1, "explanation": "Legacy or unsupported platforms no longer receive vendor security patches, leaving known vulnerabilities permanently unaddressed. This is a common and persistent risk in environments where old systems can't easily be replaced.", "resource": {"label": "Vulnerability Types (SY0-701 2.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Which mitigation technique involves isolating a network into smaller zones so that a compromise in one zone cannot easily spread to others?", "choices": ["Segmentation", "Patching", "Least privilege", "Hashing"], "correct": 0, "explanation": "Segmentation divides a network into isolated zones (using VLANs, firewalls, or physical separation) so that an attacker who compromises one segment faces additional barriers before reaching other, more sensitive segments.", "resource": {"label": "Mitigation Techniques (SY0-701 2.5)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A security team applies a temporary firewall rule and enhanced monitoring on a system that has a known vulnerability but cannot be patched immediately due to compatibility issues. What is this an example of?", "choices": ["A compensating control", "A directive control", "Non-repudiation", "Key escrow"], "correct": 0, "explanation": "A compensating control is an alternative safeguard used when the primary control (in this case, patching) can't be applied, providing similar risk reduction through other means such as extra monitoring or restricted access.", "resource": {"label": "Mitigation Techniques (SY0-701 2.5)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A company defines its entire cloud network topology, including subnets and security groups, in version-controlled configuration files that are applied automatically. What concept does this describe?", "choices": ["Infrastructure as code", "Software defined networking", "Serverless computing", "Fog computing"], "correct": 0, "explanation": "Infrastructure as code (IaC) manages and provisions infrastructure through machine-readable configuration files instead of manual processes, allowing consistent, version-controlled, and repeatable deployments.", "resource": {"label": "Cloud Infrastructure Concepts (SY0-701 3.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "In a cloud environment, an application is broken into small, independently deployable services that each handle a single business function and communicate over APIs. What architecture is this?", "choices": ["Microservices", "Monolithic architecture", "Air-gapped architecture", "Physical isolation"], "correct": 0, "explanation": "A microservices architecture decomposes an application into small, independent services that can be developed, deployed, and scaled separately, in contrast to a monolithic architecture where all functionality is bundled into a single codebase.", "resource": {"label": "Cloud Infrastructure Concepts (SY0-701 3.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A company hosts its email and CRM systems on a third-party provider's infrastructure entirely, with no on-premises servers, while another internal application still runs in the company's own data center. What deployment model best describes this combined approach?", "choices": ["Hybrid", "Private cloud", "Public cloud only", "On-premises only"], "correct": 0, "explanation": "A hybrid model combines cloud services (public or private) with on-premises infrastructure, allowing an organization to keep some workloads in-house while using cloud providers for others.", "resource": {"label": "Cloud Infrastructure Concepts (SY0-701 3.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "Where in a network architecture should a publicly accessible web server be placed to limit exposure of the internal network if the server is compromised?", "choices": ["Directly on the internal LAN", "In a screened subnet (DMZ)", "On the same VLAN as domain controllers", "Behind no firewall at all"], "correct": 1, "explanation": "A screened subnet, commonly called a DMZ, isolates public-facing servers between two firewalls (or firewall interfaces) so that if the server is compromised, the attacker still faces another barrier before reaching the internal network.", "resource": {"label": "Infrastructure Considerations (SY0-701 3.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A network engineer configures a switch so that only a single, pre-approved MAC address may communicate on a specific physical port. What is this technique called?", "choices": ["Port security", "Screened subnet", "Load balancing", "Route aggregation"], "correct": 0, "explanation": "Port security restricts which device(s) may connect to a specific switch port, typically by limiting allowed MAC addresses, helping prevent unauthorized devices from being plugged into the network.", "resource": {"label": "Infrastructure Considerations (SY0-701 3.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "Which type of firewall inspects traffic at the application layer and can identify and block specific applications or intrusion attempts, beyond simple port and IP filtering?", "choices": ["Packet-filtering firewall", "Next-generation firewall (NGFW)", "Circuit-level gateway", "Stateless firewall"], "correct": 1, "explanation": "A next-generation firewall combines traditional filtering with deep packet inspection, application awareness, and intrusion prevention capabilities, allowing it to make decisions based on application content rather than just ports and addresses.", "resource": {"label": "Firewall Types (SY0-701 3.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/firewall-types-sy0-701/"}}, {"domain": "3.0 Security Architecture", "question": "A remote employee connects to the corporate network over an encrypted tunnel so that all traffic between their laptop and the office appears to originate from inside the corporate network. What technology is being used?", "choices": ["VPN", "SD-WAN", "NAC", "SASE without a tunnel"], "correct": 0, "explanation": "A virtual private network (VPN) creates an encrypted tunnel between a remote device and a private network, protecting data in transit and making the remote device appear as though it's connected locally.", "resource": {"label": "Secure Communication (SY0-701 3.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "Which cloud security framework combines networking and security functions, such as SD-WAN and zero trust access, into a single cloud-delivered service for distributed users?", "choices": ["SASE (Secure Access Service Edge)", "IaaS", "PaaS", "Air gapping"], "correct": 0, "explanation": "Secure Access Service Edge (SASE) converges networking (like SD-WAN) and security services (like zero trust network access, secure web gateways, and CASB) into a unified, cloud-delivered platform for users regardless of location.", "resource": {"label": "Secure Communication (SY0-701 3.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A hospital classifies patient records as its highest sensitivity category and applies the strictest access controls and encryption to that data. What is this process called?", "choices": ["Data classification", "Data masking", "Tokenization", "Data minimization"], "correct": 0, "explanation": "Data classification assigns data to categories (such as public, internal, confidential, or restricted) based on sensitivity, which then determines the appropriate handling, storage, and access control requirements for that data.", "resource": {"label": "Data Protection (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A payment processor replaces credit card numbers stored in its database with randomly generated reference values that have no mathematical relationship to the original numbers. What technique is this?", "choices": ["Tokenization", "Hashing", "Data masking", "Steganography"], "correct": 0, "explanation": "Tokenization substitutes sensitive data with a non-sensitive placeholder token that has no exploitable mathematical relationship to the original value, with the actual data stored securely elsewhere, commonly used to protect payment card data.", "resource": {"label": "Data Protection (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "Which term refers to protecting data while it is actively being processed in a system's memory, such as through the use of secure enclaves?", "choices": ["Data at rest", "Data in transit", "Data in use", "Data in escrow"], "correct": 2, "explanation": "Data in use refers to data actively being processed in memory or CPU registers, which can be protected using technologies like confidential computing or secure enclaves. Data at rest is stored data, and data in transit is data moving across a network.", "resource": {"label": "Data Protection (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "An organization sets a goal that, after a disruptive incident, a critical database must be restored to a point no older than 15 minutes before the failure. Which metric describes this goal?", "choices": ["Recovery time objective (RTO)", "Recovery point objective (RPO)", "Mean time to failure (MTTF)", "Mean time to repair (MTTR)"], "correct": 1, "explanation": "Recovery point objective (RPO) defines the maximum acceptable amount of data loss measured in time, essentially how far back backups or replication must go. Recovery time objective (RTO) instead measures how quickly the system must be restored after an outage.", "resource": {"label": "Resilience and Recovery (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A company maintains a fully redundant, always-on secondary data center in a different geographic region that can take over operations within seconds if the primary site fails. What is this an example of?", "choices": ["Hot site", "Cold site", "Warm site", "Cloud backup only"], "correct": 0, "explanation": "A hot site is a fully equipped, continuously running duplicate environment that can take over operations almost immediately after a failure. A cold site provides only basic infrastructure, and a warm site falls in between, requiring some setup time.", "resource": {"label": "Resilience and Recovery (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A storage array is configured so that data is striped with parity across multiple disks, allowing the array to survive the failure of a single drive without data loss. What is this called?", "choices": ["RAID", "Load balancing", "Clustering", "Geographic dispersion"], "correct": 0, "explanation": "RAID (Redundant Array of Independent Disks) combines multiple physical disks to provide fault tolerance and/or performance improvements. Certain RAID levels, like RAID 5, use striping with parity to survive a single disk failure.", "resource": {"label": "Resilience and Recovery (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "An organization keeps one full backup and then performs backups that only capture files changed since the last full backup, requiring the full backup plus every incremental since to fully restore. What backup type is being used?", "choices": ["Incremental backup", "Differential backup", "Full backup only", "Snapshot only"], "correct": 0, "explanation": "Incremental backups only capture data changed since the most recent backup of any type (full or incremental), which is why restoring requires the last full backup plus every incremental backup taken since. Differential backups instead capture all changes since the last full backup, requiring only the full backup plus the most recent differential to restore.", "resource": {"label": "Resilience and Recovery (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "Which testing activity involves simulating a disaster recovery scenario using discussion and walkthroughs among stakeholders without actually shutting down or failing over any live systems?", "choices": ["Tabletop exercise", "Full interruption test", "Parallel test", "Live cutover"], "correct": 0, "explanation": "A tabletop exercise is a discussion-based simulation where stakeholders talk through their roles and responses to a hypothetical incident, without impacting live production systems. This makes it a lower-risk, lower-cost way to validate plans compared to a full interruption test.", "resource": {"label": "Resilience and Recovery (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Before deploying new servers, an organization defines a standardized, minimum-security configuration that all servers of a given type must meet. What is this standardized configuration called?", "choices": ["A secure baseline", "A honeypot", "A compensating control", "A screened subnet"], "correct": 0, "explanation": "A secure baseline is a documented, standardized starting configuration that defines the minimum security settings a system must have before deployment, ensuring consistency and reducing configuration drift across the environment.", "resource": {"label": "Baselines (SY0-701 4.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A systems administrator disables unused services, changes default credentials, and closes unnecessary ports on a newly deployed server. What is this overall process called?", "choices": ["Hardening", "Fuzzing", "Penetration testing", "Tokenization"], "correct": 0, "explanation": "Hardening is the process of reducing a system's attack surface by disabling unnecessary services, closing unused ports, changing default credentials, and applying secure configuration settings.", "resource": {"label": "Hardening Techniques (SY0-701 4.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Which wireless security protocol introduced Simultaneous Authentication of Equals (SAE) to replace the pre-shared key exchange used in earlier standards, providing stronger protection against offline password-guessing attacks?", "choices": ["WEP", "WPA2", "WPA3", "WPS"], "correct": 2, "explanation": "WPA3 introduced SAE, a more secure key exchange that replaces WPA2's four-way handshake and better resists offline dictionary attacks against captured handshakes.", "resource": {"label": "Wireless Security Settings (SY0-701 4.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A company requires that all corporate email and applications on employee-owned smartphones be stored in an encrypted, isolated profile separate from personal apps and data. What mobile solution is being described?", "choices": ["Full device encryption only", "Containerization", "Geofencing", "Jailbreak detection"], "correct": 1, "explanation": "Containerization creates a separate, encrypted, and managed workspace on a device for corporate data and applications, isolating it from personal data. This is common in BYOD (bring your own device) environments to protect corporate data without controlling the entire personal device.", "resource": {"label": "Mobile Solutions (SY0-701 4.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "During the software development lifecycle, a team has developers review each other's code changes before they are merged into the main branch, specifically looking for security flaws. What practice is this?", "choices": ["Static analysis only", "Peer code review", "Fuzzing", "Dynamic analysis only"], "correct": 1, "explanation": "Peer code review has other developers manually examine code changes for bugs, logic errors, and security flaws before merging, complementing automated tools like static and dynamic analysis rather than replacing them.", "resource": {"label": "Application Security (SY0-701 4.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A security tool sends large volumes of random, unexpected, or malformed input to an application to see if it crashes or behaves unexpectedly. What technique is this?", "choices": ["Fuzzing", "Static code analysis", "Manual code review", "Baseline configuration"], "correct": 0, "explanation": "Fuzzing is an automated testing technique that feeds a program random or malformed input to uncover crashes, memory leaks, or other unexpected behavior that could indicate an exploitable vulnerability.", "resource": {"label": "Application Security (SY0-701 4.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "An organization maintains a continuously updated inventory of every laptop, server, and IoT device it owns, including owner, location, and patch status. What security process does this support?", "choices": ["Asset management", "Change management", "Incident response", "Risk transference"], "correct": 0, "explanation": "Asset management involves tracking and maintaining an accurate inventory of all hardware and software assets throughout their lifecycle, which is foundational for effective patching, monitoring, and risk management.", "resource": {"label": "Asset Management (SY0-701 4.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A vulnerability scan reports that a web server is vulnerable to an exploit, but manual testing confirms the server is not actually vulnerable because a compensating configuration blocks the exploit. What is this scan result called?", "choices": ["A false positive", "A false negative", "A true positive", "An indicator of compromise"], "correct": 0, "explanation": "A false positive is when a scanner reports a vulnerability that does not actually exist or cannot actually be exploited in that environment. A false negative is the opposite and more dangerous case: a real vulnerability that the scan fails to detect.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Which industry-standard scoring system assigns a numeric severity score (0\u201310) to a vulnerability based on factors like attack complexity and impact?", "choices": ["CVE", "CVSS", "CPE", "SCAP"], "correct": 1, "explanation": "The Common Vulnerability Scoring System (CVSS) provides a standardized numeric score reflecting the severity of a vulnerability, helping organizations prioritize remediation. CVE, by contrast, is simply the unique identifier assigned to a specific known vulnerability.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A penetration tester is given full knowledge of the internal network architecture, source code, and credentials before beginning testing. What type of test is this?", "choices": ["Black-box test", "White-box test", "Gray-box test", "Passive reconnaissance only"], "correct": 1, "explanation": "A white-box test provides the tester with complete internal knowledge of the systems being tested, allowing for a deeper and more thorough assessment. A black-box test provides no internal information, simulating an external attacker's perspective.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A security operations center aggregates log data from firewalls, servers, and endpoints into a single platform that correlates events and generates alerts. What type of tool is this?", "choices": ["SIEM", "SOAR playbook only", "DLP", "NAC"], "correct": 0, "explanation": "A Security Information and Event Management (SIEM) platform collects, aggregates, and correlates log data from many sources to detect patterns, generate alerts, and support investigations, giving analysts centralized visibility.", "resource": {"label": "Monitoring (SY0-701 4.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A security team builds an automated workflow that, when a phishing email is reported, automatically extracts indicators, checks them against threat intelligence feeds, and quarantines matching emails without human intervention. What capability is this?", "choices": ["SOAR (Security Orchestration, Automation, and Response)", "SIEM correlation only", "Vulnerability scanning", "Data loss prevention"], "correct": 0, "explanation": "SOAR platforms automate and orchestrate repetitive incident response tasks across multiple tools, using predefined playbooks to take action (like quarantining an email) with little or no human intervention, speeding up response times.", "resource": {"label": "Automation and Orchestration (SY0-701 4.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Which authentication factor category does a fingerprint scan belong to?", "choices": ["Something you know", "Something you have", "Something you are", "Somewhere you are"], "correct": 2, "explanation": "A fingerprint is a biometric characteristic, which falls under \"something you are.\" Passwords are \"something you know,\" and security tokens or smart cards are \"something you have.\"", "resource": {"label": "Authentication Methods (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "An organization implements a system where a user logs in once and is automatically granted access to multiple independent applications without re-entering credentials for each one. What is this called?", "choices": ["Single sign-on (SSO)", "Federation only", "Multifactor authentication", "Privileged access management"], "correct": 0, "explanation": "Single sign-on (SSO) allows a user to authenticate once and gain access to multiple related applications or systems without logging in separately to each. Federation extends this concept across separate organizations or security domains using trust relationships.", "resource": {"label": "Identity and Access Management (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A company requires administrators to check out temporary, time-limited elevated credentials from a vault whenever they need to perform an administrative task, rather than holding standing admin rights permanently. What is this an example of?", "choices": ["Privileged access management (PAM)", "Role-based access control only", "Discretionary access control", "Mandatory access control"], "correct": 0, "explanation": "Privileged access management (PAM) solutions issue just-in-time, time-limited elevated credentials from a secure vault, reducing the risk associated with standing privileged accounts that could be compromised or misused.", "resource": {"label": "Identity and Access Management (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "When an employee leaves a company, their user account is disabled, access to all systems is revoked, and their equipment is collected. What part of the identity lifecycle does this represent?", "choices": ["Provisioning", "Deprovisioning", "Federation", "Attestation"], "correct": 1, "explanation": "Deprovisioning is the process of removing a user's access and disabling their accounts when they leave an organization or no longer need access, closing off a common avenue for insider threats or orphaned accounts.", "resource": {"label": "Identity and Access Management (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "An access control model assigns permissions to users based strictly on their job function, such as \"HR Manager\" or \"Help Desk Technician,\" rather than granting permissions to individuals directly. What model is this?", "choices": ["Role-based access control (RBAC)", "Discretionary access control (DAC)", "Mandatory access control (MAC)", "Rule-based access control"], "correct": 0, "explanation": "Role-based access control assigns permissions to defined roles that map to job functions, and users inherit permissions by being assigned to a role, which simplifies administration compared to managing permissions per individual user.", "resource": {"label": "Identity and Access Management (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "During an active security incident, an analyst copies the contents of a compromised server's RAM before powering it down for forensic analysis. Why is this step important?", "choices": ["RAM contents are permanent and can be examined at any time", "Volatile data in memory is lost once the system powers off", "RAM never contains useful forensic evidence", "It satisfies a legal requirement to always image the hard disk first"], "correct": 1, "explanation": "Memory (RAM) is volatile, meaning its contents are lost the moment the system loses power. Forensic investigators follow the order of volatility, capturing the most volatile data (like RAM) before less volatile data (like disk contents).", "resource": {"label": "Digital Forensics (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Which phase of the incident response process focuses on determining the scope, root cause, and severity of a security event after it has been detected?", "choices": ["Preparation", "Analysis", "Containment", "Lessons learned"], "correct": 1, "explanation": "The analysis phase involves investigating the detected event to understand its scope, root cause, and severity, which then informs the containment and eradication strategies. Preparation happens before an incident occurs, and lessons learned happens after it's resolved.", "resource": {"label": "Incident Response Process (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "After containing and eradicating a security incident, the response team documents what happened, what worked well, and what should change, then updates internal procedures accordingly. What phase of incident response is this?", "choices": ["Detection", "Containment", "Lessons learned", "Preparation"], "correct": 2, "explanation": "The lessons learned phase (sometimes called post-incident activity) reviews the entire incident response to identify improvements to processes, tools, and training, helping the organization respond more effectively to future incidents.", "resource": {"label": "Incident Response Process (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Which data source would be most useful for an investigator trying to determine exactly which process made an outbound network connection to a suspicious IP address at a specific time?", "choices": ["Vulnerability scan report", "Firewall and network flow logs", "A security awareness training record", "An organizational chart"], "correct": 1, "explanation": "Firewall logs and network flow data record connection details like source/destination IP, port, and timestamp, making them essential for tracing exactly which system and process communicated with a suspicious external address.", "resource": {"label": "Log Data Sources (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A network intrusion prevention system (IPS) is configured in-line with traffic flow rather than simply monitoring a mirrored copy of traffic. What capability does this in-line placement provide that a passive IDS does not?", "choices": ["The ability to log traffic for later review", "The ability to actively block malicious traffic in real time", "The ability to generate compliance reports", "The ability to encrypt data in transit"], "correct": 1, "explanation": "Because an IPS sits directly in the traffic path, it can actively block or drop malicious traffic in real time. An IDS, by contrast, typically only monitors a copy of traffic and can alert on threats but cannot stop them directly.", "resource": {"label": "Firewalls, IDS, and IPS (SY0-701 4.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A company configures its email gateway to automatically detect and quarantine outbound messages that contain unencrypted credit card numbers before they leave the network. What technology is being used?", "choices": ["Data loss prevention (DLP)", "Network access control (NAC)", "SIEM correlation", "A honeypot"], "correct": 0, "explanation": "Data loss prevention (DLP) systems monitor and inspect data in motion, at rest, and in use to detect and block sensitive information, such as credit card numbers, from leaving the organization improperly.", "resource": {"label": "Data Protection Tools (SY0-701 4.5)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A company requires that any device attempting to connect to the corporate Wi-Fi first prove it has up-to-date antivirus definitions and a current patch level before being granted network access. What technology enforces this?", "choices": ["Network access control (NAC)", "Load balancing", "Port aggregation", "A screened subnet"], "correct": 0, "explanation": "Network access control (NAC) evaluates a device's security posture, such as patch level and antivirus status, before allowing it onto the network, and can quarantine or restrict non-compliant devices.", "resource": {"label": "Network Security (SY0-701 4.5)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Employees at a company are required to complete an annual training module covering phishing recognition, password hygiene, and data handling policies. What security process does this represent?", "choices": ["Security awareness training", "Penetration testing", "Vulnerability scanning", "Incident response"], "correct": 0, "explanation": "Security awareness training educates employees on recognizing and responding to threats like phishing and social engineering, and on following organizational policies, reducing the human-related risk factor across the organization.", "resource": {"label": "Security Awareness (SY0-701 5.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A document that establishes high-level, overarching goals for how an organization protects its information, without dictating specific technical steps, is best described as which of the following?", "choices": ["A security policy", "A procedure", "A security control", "A playbook"], "correct": 0, "explanation": "A security policy defines high-level goals and management's intent regarding security, while procedures provide the specific, detailed step-by-step instructions for carrying out that policy in practice.", "resource": {"label": "Security Policies (SY0-701 5.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/security-policies-sy0-701/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A document specifying that all servers must use TLS 1.2 or higher for encrypted communications is an example of which type of governance document?", "choices": ["A standard", "A guideline", "A policy", "A procedure"], "correct": 0, "explanation": "A standard specifies mandatory, specific technical requirements (such as a minimum TLS version) that support a broader policy. A guideline, by contrast, offers recommended but not mandatory best practices.", "resource": {"label": "Security Governance (SY0-701 5.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "Which type of governance document provides step-by-step instructions that an employee must follow to complete a specific security-related task, such as onboarding a new employee's account?", "choices": ["Procedure", "Standard", "Policy", "Guideline"], "correct": 0, "explanation": "A procedure gives detailed, sequential instructions for completing a specific task consistently, translating the higher-level intent of policies and standards into concrete action.", "resource": {"label": "Security Governance (SY0-701 5.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "An organization identifies that a critical application has no failover system, calculates the potential cost of downtime, and decides to purchase insurance instead of building redundancy. What risk management strategy is this?", "choices": ["Risk avoidance", "Risk transference", "Risk acceptance", "Risk mitigation"], "correct": 1, "explanation": "Risk transference shifts the financial impact of a risk to a third party, commonly through purchasing insurance, rather than reducing the likelihood or impact of the risk directly (mitigation) or simply accepting it as-is.", "resource": {"label": "Risk Management (SY0-701 5.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A company decides that the potential benefit of launching a new feature does not outweigh the security risk it introduces, and cancels the project entirely. What risk management strategy does this represent?", "choices": ["Risk avoidance", "Risk transference", "Risk mitigation", "Risk acceptance"], "correct": 0, "explanation": "Risk avoidance eliminates the risk entirely by not engaging in the activity that creates it, such as canceling a risky project, in contrast to mitigation, which reduces but does not eliminate the risk.", "resource": {"label": "Risk Management (SY0-701 5.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A risk assessment assigns a risk a rating of \"High\" based on qualitative categories like High, Medium, and Low rather than calculating a specific dollar value. What type of risk analysis is being performed?", "choices": ["Quantitative risk analysis", "Qualitative risk analysis", "Risk transference", "Business impact analysis"], "correct": 1, "explanation": "Qualitative risk analysis uses descriptive categories (High, Medium, Low) based on judgment and experience, while quantitative analysis assigns specific numeric or monetary values, such as calculating an annualized loss expectancy.", "resource": {"label": "Risk Analysis (SY0-701 5.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A risk analyst calculates that a particular threat is expected to cause $50,000 in damage each time it occurs, and is expected to occur twice per year. What is the annualized loss expectancy (ALE)?", "choices": ["$25,000", "$50,000", "$100,000", "$150,000"], "correct": 2, "explanation": "Annualized loss expectancy (ALE) is calculated as Single Loss Expectancy (SLE) multiplied by Annualized Rate of Occurrence (ARO): $50,000 x 2 = $100,000 per year.", "resource": {"label": "Risk Analysis (SY0-701 5.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "An organization maintains a centralized document listing every identified risk, its likelihood, impact, owner, and current treatment status. What is this document called?", "choices": ["A risk register", "A business impact analysis", "A service level agreement", "A right-to-audit clause"], "correct": 0, "explanation": "A risk register is a centralized tracking document that records identified risks along with their likelihood, potential impact, assigned owner, and current mitigation or treatment status, supporting ongoing risk oversight.", "resource": {"label": "Risk Management (SY0-701 5.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "Before signing a contract with a new cloud service provider, a company sends a detailed questionnaire asking about the vendor's security controls, certifications, and incident history. What process is this?", "choices": ["Vendor risk assessment", "Penetration testing", "Business continuity planning", "Change management"], "correct": 0, "explanation": "A vendor (or third-party) risk assessment evaluates a prospective or existing supplier's security posture, often through questionnaires, certifications, and audits, before granting them access to data or systems.", "resource": {"label": "Third-Party Risk Management (SY0-701 5.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A contract between a company and its cloud provider specifies that the provider must guarantee 99.9% uptime and defines penalties if that threshold is not met. What type of agreement is this?", "choices": ["Service level agreement (SLA)", "Non-disclosure agreement (NDA)", "Memorandum of understanding (MOU)", "Business partnership agreement (BPA)"], "correct": 0, "explanation": "A service level agreement (SLA) formally defines the expected level of service, such as uptime guarantees, response times, and penalties for failing to meet those commitments, b
