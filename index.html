    ["Agent-based web filter", "Filter installed on the device; works anywhere.", "\"remote / traveling users\""],
    ["Port security", "Switch feature restricting connections by MAC.", "\"physical addresses\""],
    ["NAC / 802.1X", "Checks device identity and compliance before granting network access.", "\"compliance policies\""],
    ["EAP", "Authentication framework supporting many methods.", "\"multiple authentication methods\""],
    ["SELinux vs chroot", "Mandatory access policy on processes vs a restricted file view.", "\"minimum privileges for processes\""]
  ]},
  { name: "Email authentication", obj: "2.2 / 4.5", terms: [
    ["SPF", "DNS record listing which servers may send for the domain.", "\"authorized mail servers\""],
    ["DKIM", "Digital signature proving the message came from the domain unaltered.", "\"signature\""],
    ["DMARC", "Policy (none / quarantine / reject) + reporting, built on SPF + DKIM.", "\"reporting\""],
    ["None of them", "…encrypt email. That's TLS / S/MIME.", "\"encrypts\" = wrong answer"]
  ]},
  { name: "Control categories & types", obj: "1.1", terms: [

    ["Physical", "Protects physical space: locks, fences, cameras, guards.", "facility"],
    ["Preventive / Detective / Corrective", "Stops it / finds it / fixes it after.", ""],
    ["Deterrent / Directive / Compensating", "Discourages / tells people what to do / substitutes for a missing control.", "badges on display = deterrent"]
  ]},
  { name: "Deception", obj: "1.2", terms: [
    ["Honeypot", "One decoy system.", "single server"],
    ["Honeynet", "A network of decoys.", "multiple instances"],
    ["Honeyfile", "A decoy document.", "\"merger_plans.docx\""],
    ["Honeytoken", "Fake data: record, credential, API key.", "fake record or credential"]
  ]},
  { name: "Social engineering", obj: "2.2", terms: [
    ["Phishing", "Broad, generic email lure.", "mass"],
    ["Spear phishing", "Targeted at a specific group with specific details.", "\"references a recent project\""],
    ["Whaling", "Targets executives.", "CFO / CEO"],
    ["BEC", "Fraud to get money or data sent: fake invoices, changed bank details.", "\"new bank account\""],
    ["Vishing / smishing", "Voice / SMS phishing.", "channel"],
    ["Impersonation", "Pretending to be a specific trusted person.", "\"claiming to be Enrique from IT\""],
    ["Pretexting", "The made-up story used to set up the attack.", "the story, not the attack"],

  ]},

  ]},
  { name: "Attacks & indicators", obj: "2.3 / 2.4", terms: [

  { name: "Monitoring tools: what they do / don't", obj: "4.4", terms: [

    ["SCAP", "Standard language for automated config and vuln checks and compliance.", "not encryption"],
    ["DLP", "Stops sensitive data leaving.", "not malware, not system access"],
    ["Antivirus", "Finds and removes known malware of many types.", "can't find unknown vulnerabilities"],
    ["Log aggregation", "Centralizes logs; simplifies analysis.", "doesn't add complexity"],
    ["Archiving", "Keeps historical logs for investigations and compliance.", "not a crash backup"],
    ["Quarantine", "Isolates a file so no one can access it.", "not deleted, not forwarded"]
  ]},
  { name: "Identity & access", obj: "4.6", terms: [
    ["SAML", "Federated SSO: IdP passes authentication assertions to SPs.", "\"IdP to SP\""],
    ["OAuth", "Authorization for API access (delegation).", "\"authorize API\""],
    ["OpenID Connect", "Authentication layer on top of OAuth.", "\"login with Google\""],
    ["Kerberos", "Ticket-based authentication in Windows domains.", "\"tickets\""],
    ["Passkey", "Public-key credential unlocked by device unlock; passwordless.", "\"unlock phone, public key\""],
    ["Attestation (IAM)", "Periodic review and recertification of users' access rights.", "\"data owners review access\""],
    ["Least privilege vs RBAC", "Principle (minimum access) vs mechanism (roles).", "\"principle\" = least privilege"],
    ["Factors", "Know (password, PIN) / have (token app) / are (voice, fingerprint) / somewhere (GPS, geofence).", ""]
  ]},
  { name: "Audits & assessments", obj: "5.5", terms: [
    ["Attestation (compliance)", "Formal signed statement that controls are in place.", "\"signed by a senior official\""],
    ["Internal audit", "The org checks itself against its own standards.", "\"its own standards\""],
    ["Audit committee", "Internal, independent body overseeing controls and financial reporting.", "internal oversight"],
    ["Regulatory examination", "Government agency checks legal compliance.", "\"government agency\""],
    ["Independent third-party audit", "External impartial auditor.", "not government"],
    ["Active vs passive recon", "Touches the target (scans) vs doesn't (OSINT, public info).", "OSINT = passive"]
  ]},
  { name: "Laws & standards", obj: "5.1", terms: [
    ["GDPR", "EU personal data regulation.", "EU"],
    ["CCPA", "California horizontal consumer privacy law.", "\"horizontal, like GDPR\""],
    ["GLBA", "US financial-sector privacy (vertical).", "banks"],
    ["FISMA", "Security for US federal agency systems.", "federal agencies"],
    ["Computer Security Act (1987)", "Required federal agencies to create security plans for sensitive systems.", "1987"],
    ["PCI DSS", "Industry standard for card data; not a law.", "credit cards"],
    ["ISO/IEC 27001 / 27002 / 27017", "ISMS framework / control guidance / cloud controls.", "framework = 27001"],
    ["NIST SP 800-63", "Digital identity guidelines.", "identity"]
  ]}
];

</script>
<script>
(function(){
  const DOMAINS = [
    { key: "1.0 General Security Concepts", short: "1.0 Concepts", weight: 12, color: "#57d38c" },
    { key: "2.0 Threats, Vulnerabilities, and Mitigations", short: "2.0 Threats", weight: 22, color: "#ef6a6a" },
    { key: "3.0 Security Architecture", short: "3.0 Architecture", weight: 18, color: "#2dd9c4" },
    { key: "4.0 Security Operations", short: "4.0 Operations", weight: 28, color: "#f2b84b" },
    { key: "5.0 Security Program Management and Oversight", short: "5.0 Governance", weight: 20, color: "#9d8cf2" }
  ];
  const domainColor = k => (DOMAINS.find(d => d.key === k) || {}).color || (k === "Firewall Rules" || k === "Ports & Protocols" ? "#f2b84b" : "#7d93a3");
  const domainShort = k => (DOMAINS.find(d => d.key === k) || {}).short || k;

  const STORAGE_KEY = "attempt-history";
  const app = document.getElementById("app");

  const FULL_EXAM_COUNTS = {
    "1.0 General Security Concepts": 11,
    "2.0 Threats, Vulnerabilities, and Mitigations": 20,
    "3.0 Security Architecture": 16,
    "4.0 Security Operations": 25,
    "5.0 Security Program Management and Oversight": 18
  };
  const DOMAIN_QUIZ_CAP = 20;
  const TIMED_EXAM_SECONDS = 90 * 60;

  function formatTime(totalSeconds){
    const s = Math.max(0, Math.round(totalSeconds));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    const mm = (h > 0 ? String(m).padStart(2,"0") : String(m)).toString();
    const ss = String(sec).padStart(2,"0");
    return h > 0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
  }

  let state = { view: "home", history: [] };

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateDynamicQuestions(){
    const scenarios = ["a ransomware infection on a file server", "a distributed denial-of-service outage", "a stolen unencrypted laptop", "a phishing-driven account takeover", "a compromised third-party vendor integration", "a misconfigured cloud storage exposure"];
    const scenario = scenarios[Math.floor(Math.random()*scenarios.length)];
    const sleOptions = [8000, 12000, 15000, 25000, 40000, 60000];
    const aroOptions = [
      { value: 0.5, label: "once every two years" },
      { value: 1, label: "about once per year" },
      { value: 2, label: "about twice per year" },
      { value: 4, label: "about four times per year" },
      { value: 0.25, label: "about once every four years" }
    ];
    const sle = sleOptions[Math.floor(Math.random()*sleOptions.length)];
    const aro = aroOptions[Math.floor(Math.random()*aroOptions.length)];
    const ale = sle * aro.value;
    const distractors = new Set([ale]);
    let guard = 0;
    while (distractors.size < 4 && guard < 20){
      guard++;
      const factor = [0.25, 0.5, 2, 4][Math.floor(Math.random()*4)];
      const candidate = Math.round(sle * aro.value * factor);
      if (candidate > 0) distractors.add(candidate);
    }
    const choiceValues = shuffle(Array.from(distractors));
    const choices = choiceValues.map(v => "$" + v.toLocaleString());
    const correct = choiceValues.indexOf(ale);

    return [{
      domain: "5.0 Security Program Management and Oversight",
      question: "A risk analyst estimates that " + scenario + " would cause $" + sle.toLocaleString() + " in damage each time it occurs, and expects it to happen " + aro.label + " (an ARO of " + aro.value + "). What is the annualized loss expectancy (ALE)?",
      choices: choices,
      correct: correct,
      explanation: "Annualized loss expectancy (ALE) equals Single Loss Expectancy (SLE) multiplied by Annualized Rate of Occurrence (ARO): $" + sle.toLocaleString() + " x " + aro.value + " = $" + ale.toLocaleString() + " per year.",
      resource: { label: "Risk Analysis (SY0-701 5.2)", url: "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/" }
    }];
  }

  const ACRONYM_QUIZ_SIZE = 25;
  const ACRONYM_DOMAIN_KEY = "Acronyms";

  function buildAcronymQuestions(count){
    const pool = shuffle(ACRONYM_BANK);
    const take = pool.slice(0, Math.min(count, pool.length));
    return take.map(item => {
      const distractorPool = ACRONYM_BANK.filter(x => x.a !== item.a);
      const distractors = shuffle(distractorPool).slice(0, 3).map(x => x.e);
      const choices = [item.e].concat(distractors);
      return {
        domain: ACRONYM_DOMAIN_KEY,
        question: `What does the acronym "${item.a}" stand for?`,
        choices: choices,
        correct: 0,
        explanation: `${item.a} stands for ${item.e}.`,
        resource: { label: `Look up "${item.a}" in the SY0-701 course glossary`, url: "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/" }
      };
    });
  }


  // ===== Weak-spot (Dion) support =====
  const DOMAIN_BY_NUM = { "1": DOMAINS[0].key, "2": DOMAINS[1].key, "3": DOMAINS[2].key, "4": DOMAINS[3].key, "5": DOMAINS[4].key };
  const WEAK_PREFIX = "WEAK:";
  const PORTS_KEY = "Ports & Protocols";
  const FIREWALL_KEY = "Firewall Rules";
  const KNOWN_KEY = "weak-known-cards";
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const MESSER = "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/";

  function weakQuestion(m){
    const times = m.n && m.n > 1 ? ` You missed this on ${m.n} different attempts.` : "";
    return {
      domain: DOMAIN_BY_NUM[m.d],
      question: esc(m.q),
      choices: [m.a].concat(m.w).map(esc),
      correct: 0,
      explanation: `<span class="pick-note">On the Dion exam you chose: ${esc(m.w[0])}.${times}</span>${esc(m.why)}`,
      resource: { label: `SY0-701 objective ${m.obj}`, url: MESSER }
    };
  }

  function weakPool(filter){
    let list = MISS_BANK_RAW;
    if (filter === "repeat") list = list.filter(m => (m.n || 1) > 1);
    else if (filter !== "all") list = list.filter(m => m.d === filter);
    return list.map(weakQuestion);
  }

  function buildPortQuestions(){
    const qs = [];
    PORT_TABLE.forEach(p => {
      const [svc, port, proto, phrase] = p;
      const others = shuffle(PORT_TABLE.filter(x => x[1] !== port)).slice(0,3);
      qs.push({
        domain: PORTS_KEY,
        question: `Which port / protocol is used for <b>${esc(svc)}</b> (${esc(phrase)})?`,
        choices: [`${port} (${proto})`].concat(others.map(o => `${o[1]} (${o[2]})`)).map(esc),
        correct: 0,
        explanation: esc(`${svc} = ${port} ${proto}.`),
        resource: { label: "Ports and protocols reference", url: MESSER }
      });
      qs.push({
        domain: PORTS_KEY,
        question: `A firewall rule uses port <b>${esc(port)} (${esc(proto)})</b>. Which service is it for?`,
        choices: [svc].concat(others.map(o => o[0])).map(esc),
        correct: 0,
        explanation: esc(`${port} ${proto} = ${svc}: ${phrase}.`),
        resource: { label: "Ports and protocols reference", url: MESSER }
      });
    });
    const missed = qs.filter((q,i) => PORT_TABLE[Math.floor(i/2)][4]);
    const rest = qs.filter((q,i) => !PORT_TABLE[Math.floor(i/2)][4]);
    return shuffle(missed).slice(0,18).concat(shuffle(rest).slice(0,12));
  }

  function buildFirewallQuestions(){
    return FIREWALL_DRILLS.map(f => ({
      domain: FIREWALL_KEY, question: esc(f.q), choices: f.choices.map(esc), correct: 0,
      explanation: esc(f.why), resource: { label: "Firewall rules (SY0-701 4.5)", url: MESSER }
    }));
  }

  function loadKnown(){
    try { return new Set(JSON.parse(localStorage.getItem(KNOWN_KEY) || "[]")); } catch(e){ return new Set(); }
  }
  function saveKnown(set){
    try { localStorage.setItem(KNOWN_KEY, JSON.stringify(Array.from(set))); } catch(e){}
  }
  function allCards(setName){
    const sets = setName ? VOCAB_SETS.filter(s => s.name === setName) : VOCAB_SETS;
    const out = [];
    sets.forEach(s => s.terms.forEach(t => out.push({ set: s.name, obj: s.obj, term: t[0], def: t[1], tell: t[2], id: s.name + "::" + t[0] })));
    return out;
  }

  // ===== Fresh Question Bank =====
  const BANK = (window.FRESH_BANK || []).map((q, i) => Object.assign({ id: i }, q));
  const BANK_PREFIX = "BANK:";
  const BANK_STATS_KEY = "bank-stats";
  function loadBankStats(){ try { return JSON.parse(localStorage.getItem(BANK_STATS_KEY) || "{}"); } catch(e){ return {}; } }
  function recordBank(id, ok){
    const st = loadBankStats(); const r = st[id] || [0,0,0];
    r[0] += 1; if (ok) r[1] += 1; r[2] = ok ? 1 : 0; st[id] = r;
    try { localStorage.setItem(BANK_STATS_KEY, JSON.stringify(st)); } catch(e){}
  }
  function bankQuestion(q){
    return {
      domain: DOMAIN_BY_NUM[q.o[0]], obj: q.o, bankId: q.id,
      question: esc(q.q), choices: q.c.map(esc), correct: q.a,
      optExpl: q.e.map(esc), explanation: esc(q.e[q.a]),
      resource: { label: `SY0-701 objective ${q.o}: ${OBJ_NAMES[q.o] || ""}`, url: MESSER }
    };
  }
  // Prefer questions not yet answered correctly; then least-seen.
  function pickFrom(list, n){
    const st = loadBankStats();
    const score = q => { const r = st[q.id]; if (!r) return Math.random(); if (r[2] === 0) return 1 + Math.random(); return 2 + r[0] + Math.random(); };
    return list.slice().sort((a,b) => score(a) - score(b)).slice(0, n);
  }
  function targetWeights(){
    // Blend Dion miss rate per objective with bank miss rate.
    const st = computeStats(getHistory());
    const dion = {}; st.objs.forEach(o => dion[o.obj] = o.miss);
    const bs = loadBankStats(); const bank = {};
    BANK.forEach(q => { const r = bs[q.id]; if (!r) return; const b = bank[q.o] || (bank[q.o] = [0,0]); b[0] += r[0]; b[1] += r[1]; });
    const objs = Object.keys(OBJ_NAMES).map(o => {
      const d = dion[o] != null ? dion[o] : 0.3;
      const b = bank[o] && bank[o][0] >= 5 ? 1 - bank[o][1]/bank[o][0] : null;
      return { o, w: b == null ? d : 0.6*d + 0.4*b };
    }).sort((a,b) => b.w - a.w);
    return objs;
  }
  function buildBankQuestions(key){
    let list = [];
    if (key === "exam"){
      Object.keys(FULL_EXAM_COUNTS).forEach((dk, i) => {
        const n = String(i+1);
        list = list.concat(pickFrom(BANK.filter(q => q.o[0] === n), FULL_EXAM_COUNTS[dk]));
      });
    } else if (key === "target"){
      const top = targetWeights().slice(0, 8);
      const tw = top.reduce((s,x) => s + x.w, 0);
      top.forEach(t => { list = list.concat(pickFrom(BANK.filter(q => q.o === t.o), Math.max(2, Math.round(25 * t.w / tw)))); });
      list = list.slice(0, 25);
    } else if (key === "missed"){
      const st = loadBankStats();
      list = BANK.filter(q => st[q.id] && st[q.id][2] === 0).slice(0, 30);
    } else if (key.indexOf("d") === 0){
      list = pickFrom(BANK.filter(q => q.o[0] === key.slice(1)), 20);
    } else if (key.indexOf("o") === 0){
      list = pickFrom(BANK.filter(q => q.o === key.slice(1)), 15);
    }
    return list.map(bankQuestion);
  }

  function poolForDomain(domainKey){
    const base = QUESTION_BANK.filter(q => q.domain === domainKey);
    if (domainKey === "5.0 Security Program Management and Oversight"){
      return base.concat(generateDynamicQuestions());
    }
    return base;
  }

  function finalizeQuestions(rawList){
    return shuffle(rawList).map(q => {
      const order = shuffle(q.choices.map((c, i) => i));
      return {
        domain: q.domain,
        question: q.question,
        explanation: q.explanation,
        resource: q.resource,
        choices: order.map(i => q.choices[i]),
        correctIndex: order.indexOf(q.correct),
        optExpl: q.optExpl ? order.map(i => q.optExpl[i]) : null,
        bankId: q.bankId != null ? q.bankId : null,
        obj: q.obj || null
      };
    });
  }

  function buildAttemptQuestions(domainFilter){
    if (domainFilter && domainFilter.indexOf(WEAK_PREFIX) === 0){
      return finalizeQuestions(weakPool(domainFilter.slice(WEAK_PREFIX.length)));
    }
    if (domainFilter && domainFilter.indexOf(BANK_PREFIX) === 0){
      return finalizeQuestions(buildBankQuestions(domainFilter.slice(BANK_PREFIX.length)));
    }
    if (domainFilter === PORTS_KEY) return finalizeQuestions(buildPortQuestions());
    if (domainFilter === FIREWALL_KEY) return finalizeQuestions(buildFirewallQuestions());
    if (domainFilter === ACRONYM_DOMAIN_KEY){
      return finalizeQuestions(buildAcronymQuestions(ACRONYM_QUIZ_SIZE));
    }
    if (domainFilter){
      const pool = shuffle(poolForDomain(domainFilter));
      const take = pool.slice(0, Math.min(DOMAIN_QUIZ_CAP, pool.length));
      return finalizeQuestions(take);
    }
    let combined = [];
    Object.keys(FULL_EXAM_COUNTS).forEach(domainKey => {
      const pool = shuffle(poolForDomain(domainKey));
      const count = Math.min(FULL_EXAM_COUNTS[domainKey], pool.length);
      combined = combined.concat(pool.slice(0, count));
    });
    return finalizeQuestions(combined);
  }


  async function loadHistory(){
    try {

  function getHistory(){
    const map = {};
    DION_HISTORY_BAKED.forEach(a => { map[a.attempt] = a; });

  function computeStats(hist){
    const seen = new Set();
    const attempts = hist.map(a => {
      let nC=0,nT=0,rC=0,rT=0;
      a.items.forEach(it => { if (it[3]) return; if (seen.has(it[0])){ rT++; rC+=it[1]; } else { nT++; nC+=it[1]; } });
      a.items.forEach(it => { if (!it[3]) seen.add(it[0]); });
      return { attempt:a.attempt, date:a.date, pct:Math.round(100*a.score/a.total), newPct: nT ? Math.round(100*nC/nT) : null, nT, rT, rPct: rT ? Math.round(100*rC/rT) : null, src:a.src };
    });
    const tot = (list, f) => { let c=0,t=0; list.forEach(a => a.items.forEach(it => { if (f(it)){ t++; c+=it[1]; } })); return [c,t]; };
    const last3 = hist.slice(-3);
    const domains = DOMAINS.map((d,i) => {
      const n = String(i+1);
      const all = tot(hist, it => it[2][0] === n), l3 = tot(last3, it => it[2][0] === n);
      return { d:n, name:d.key, weight:d.weight, all, l3, misses: all[1]-all[0] };
    });
    const objMap = {};
    hist.forEach(a => a.items.forEach(it => { const o = objMap[it[2]] || (objMap[it[2]] = [0,0]); o[1]++; o[0]+=it[1]; }));
    const objs = Object.keys(objMap).map(k => ({ obj:k, c:objMap[k][0], t:objMap[k][1], miss: 1 - objMap[k][0]/objMap[k][1] }))
      .filter(o => o.t >= 8).sort((a,b) => b.miss - a.miss);
    let nC=0,nT=0,rC=0,rT=0; attempts.forEach(a => { if (a.newPct!=null){ nT+=a.nT; nC+=Math.round(a.newPct*a.nT/100);} if (a.rPct!=null){ rT+=a.rT; rC+=Math.round(a.rPct*a.rT/100);} });
    return { attempts, domains, objs, newOverall: nT ? Math.round(100*nC/nT) : null, repOverall: rT ? Math.round(100*rC/rT) : null, totalQ: hist.reduce((s,a)=>s+a.items.length,0), totalMiss: hist.reduce((s,a)=>s+a.items.filter(i=>!i[1]).length,0) };
  }

  function wireUpload(after){
    const inp = document.getElementById("dion-file");
    if (!inp) return;
    inp.addEventListener("change", async () => {
      const st = document.getElementById("upload-status");
      const file = inp.files[0]; if (!file) return;
      st.textContent = "Reading " + file.name + "…";
      try {
        const rec = await DionParser.parseFile(file);
        const entry = { attempt: rec.attempt, date: rec.date, score: rec.score, total: rec.total, src: "upload",
          items: rec.items.map(i => [i.k, i.ok ? 1 : 0, i.obj].concat(i.pbq ? [i.pbq] : [])) };
        const ups = loadUploads().filter(a => a.attempt !== entry.attempt); ups.push(entry);
        if (!saveUploads(ups)) throw new Error("Couldn't save to this browser's storage.");
        const wrong = entry.items.filter(i => !i[1]);
        const byObj = {}; wrong.forEach(i => byObj[i[2]] = (byObj[i[2]]||0)+1);
        const top = Object.keys(byObj).sort((a,b)=>byObj[b]-byObj[a]).slice(0,4).map(o => `${o} (${byObj[o]})`).join(", ");
        st.innerHTML = `<span class="pct-good">Added attempt ${entry.attempt}: ${entry.score}/${entry.total} (${Math.round(100*entry.score/entry.total)}%).</span> Most misses: ${esc(top)}.`;

    });

  function startFlash(setName){
    const known = loadKnown();
    let cards = allCards(setName || null);
    const unknown = cards.filter(c => !known.has(c.id));
    if (!setName) cards = unknown.length ? unknown : cards;
    state.flash = { setName: setName || "All sets", cards: shuffle(cards), idx: 0, flipped: false, gotIt: 0, again: 0 };
    state.view = "flash";
    render();
    window.scrollTo(0,0);
  }

  function renderFlash(){
    const f = state.flash;
    if (f.idx >= f.cards.length){
      app.innerHTML = `${header()}${tabs()}<div class="card" style="text-align:center;">
        <div class="score-hero"><div class="big">${f.gotIt}</div><div class="label">cards marked known &middot; ${f.again} sent back for another look</div></div>
        <div class="btn-row"><button class="btn btn-ghost" id="fl-back">Back to Weak Spots</button><button class="btn btn-primary" id="fl-again">Go again</button></div></div>`;
      wireTabs();
      document.getElementById("fl-back").addEventListener("click", () => { state.view = "weak"; render(); });
      document.getElementById("fl-again").addEventListener("click", () => startFlash(f.setName === "All sets" ? "" : f.setName));
      return;
    }
    const c = f.cards[f.idx];
    const pct = Math.round((f.idx / f.cards.length) * 100);
    app.innerHTML = `
      ${header()}
      ${tabs()}
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="card">
        <div class="q-meta"><span class="q-num">Card ${f.idx+1} / ${f.cards.length} &middot; ${esc(f.setName)}</span><span class="q-domain-badge">obj ${esc(c.obj)}</span></div>
        <div class="flashcard" id="fc">
          <div class="setname">${esc(c.set)}</div>
          <div class="term">${esc(c.term)}</div>
          ${f.flipped ? `<div class="def">${esc(c.def)}</div>${c.tell ? `<div class="tell" style="margin-top:10px;">tell: ${esc(c.tell)}</div>` : ""}` : `<div class="hint">tap to reveal</div>`}
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="fl-exit">Exit</button>
          ${f.flipped ? `<span style="display:flex; gap:8px;"><button class="btn btn-ghost" id="fl-no">Again</button><button class="btn btn-primary" id="fl-yes">Got it</button></span>` : `<button class="btn btn-primary" id="fl-flip">Reveal</button>`}
        </div>
      </div>`;
    wireTabs();
    const flip = () => { f.flipped = true; render(); };
    document.getElementById("fc").addEventListener("click", () => { if (!f.flipped) flip(); });
    const fb = document.getElementById("fl-flip"); if (fb) fb.addEventListener("click", flip);
    document.getElementById("fl-exit").addEventListener("click", () => { state.view = "weak"; render(); });
    const yes = document.getElementById("fl-yes");
    if (yes) yes.addEventListener("click", () => {
      const k = loadKnown(); k.add(c.id); saveKnown(k);
      f.gotIt += 1; f.idx += 1; f.flipped = false; render();
    });
    const no = document.getElementById("fl-no");
    if (no) no.addEventListener("click", () => {
      const k = loadKnown(); k.delete(c.id); saveKnown(k);
      f.again += 1; f.cards.push(c); f.idx += 1; f.flipped = false; render();
    });
  }

  function renderHome(){
    const historyRows = state.history.length ? state.history.map(h => {
      const pct = Math.round((h.correct / h.total) * 100);
      const timeNote = h.elapsedSeconds != null ? ` &middot; ${formatTime(h.elapsedSeconds)}${h.timedOut ? " (time expired)" : ""}` : "";
      return `<div class="history-row">
        <span class="muted">${fmtDate(h.date)} &middot; ${h.label}${timeNote}</span>
        <span class="history-score ${scoreClass(pct)}">${h.correct}/${h.total} (${pct}%)</span>
      </div>`;
    }).join("") : `<div class="muted">No attempts yet. Take a quiz below to start tracking your scores.</div>`;

    app.innerHTML = `
      ${header()}
      ${tabs()}
      ${domainMeter()}
      <div class="card">
        <h2>Start a practice session</h2>
        <p class="muted">Every attempt draws a fresh, randomly shuffled selection from a ${QUESTION_BANK.length}-question pool (plus a few dynamically generated calculation questions), so retakes rarely look the same twice. Each answer gives instant feedback with an explanation and a free study resource.</p>
        <div class="mode-grid">
          <button class="mode-btn" data-mode="full">
            <div class="m-title">Full 90-Question Exam</div>
            <div class="m-sub">Weighted like the real exam &middot; fresh random draw every time</div>
          </button>
          <button class="mode-btn" data-mode="timed">
            <div class="m-title">&#9201; Timed 90-Question Exam</div>
            <div class="m-sub">90-minute countdown, just like exam day &middot; auto-submits at 0:00</div>
          </button>
          <button class="mode-btn" data-mode="acronym">
            <div class="m-title">&#128225; Acronym Drill</div>
            <div class="m-sub">${Math.min(ACRONYM_QUIZ_SIZE, ACRONYM_BANK.length)} of ${ACRONYM_BANK.length} SY0-701 acronyms per session</div>
          </button>
          ${DOMAINS.map(d => `
          <button class="mode-btn" data-mode="domain" data-domain="${d.key}">
            <div class="m-title">${d.short}</div>
            <div class="m-sub">${Math.min(DOMAIN_QUIZ_CAP, QUESTION_BANK.filter(q=>q.domain===d.key).length)} of ${QUESTION_BANK.filter(q=>q.domain===d.key).length}+ questions per session &middot; ${d.weight}% of exam</div>
          </button>`).join("")}
        </div>
      </div>
      <div class="card">
        <h2>Attempt history</h2>
        ${historyRows}
        ${state.history.length ? `<div style="margin-top:12px;"><button class="btn btn-ghost" id="clear-history">Clear history</button></div>` : ""}
      </div>
      <div class="card" style="text-align:center;">
        <h2 style="margin-top:0;">Want a game-ified way to drill?</h2>
        <p class="muted">Arcade Mode turns this same question and acronym bank into a level-based game with streak combos, an integrity bar, and a final boss fight &mdash; same content, faster pace.</p>
        <a class="btn btn-primary" style="display:inline-block; text-decoration:none;" href="game.html">Play Arcade Mode &rarr;</a>
      </div>
      <div class="footer-note">Original practice questions written to mirror official SY0-701 domain weighting &mdash; not reproduced from any copyrighted exam prep book.</div>
    `;

    app.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const mode = btn.getAttribute("data-mode");
        const domain = btn.getAttribute("data-domain");
        if (mode === "domain") startQuiz(domain, domainShort(domain), false);
        else if (mode === "timed") startQuiz(null, "Timed 90-Question Exam", true);
        else if (mode === "acronym") startQuiz(ACRONYM_DOMAIN_KEY, "Acronym Drill", false);
        else startQuiz(null, "Full 90-Question Exam", false);
      });
    });
    const clearBtn = document.getElementById("clear-history");
    if (clearBtn) clearBtn.addEventListener("click", clearHistory);
    wireTabs();
  }

  function startQuiz(domainFilter, label, timed){
    if (state.quiz && state.quiz.timerId){ clearInterval(state.quiz.timerId); }
    state.view = "quiz";
    state.quiz = {
      label: label,
      domainFilter: domainFilter,
      timed: !!timed,
      questions: buildAttemptQuestions(domainFilter),
      index: 0,
      answers: [],
      answered: false,
      selected: null,
      startedAt: Date.now(),
      secondsRemaining: timed ? TIMED_EXAM_SECONDS : null,
      timerId: null,
      timedOut: false
    };
    render();
    if (timed) startTimer();
  }

  function startTimer(){
    const quiz = state.quiz;
    quiz.timerId = setInterval(() => {
      quiz.secondsRemaining -= 1;
      const el = document.getElementById("timer-display");
      if (el){
        el.textContent = formatTime(quiz.secondsRemaining);
        el.classList.toggle("timer-low", quiz.secondsRemaining <= 300);
      }
      if (quiz.secondsRemaining <= 0){
        clearInterval(quiz.timerId);
        quiz.timerId = null;
        autoSubmitOnTimeout();
      }
    }, 1000);
  }

  function autoSubmitOnTimeout(){
    const quiz = state.quiz;
    const skipRemaining = (fromIndex) => {
      for (let i = fromIndex; i < quiz.questions.length; i++){
        const q = quiz.questions[i];
        if (i === quiz.index && quiz.answered) continue;
        quiz.answers.push({
          domain: q.domain, correct: false, question: q.question,
          explanation: q.explanation, resource: q.resource,
          chosen: "(no answer \u2014 time expired)", correctChoice: q.choices[q.correctIndex]
        });
      }
    };
    skipRemaining(quiz.index);
    quiz.timedOut = true;
    finishQuiz();
  }

  function optBreakdown(q, selected){
    return `<div class="optx">` + q.choices.map((c, i) => {
      const isC = i === q.correctIndex, isP = i === selected;
      const tag = isC ? `<span class="ox-tag ok">&#10003; Correct</span>` : isP ? `<span class="ox-tag bad">&#10007; Your answer</span>` : `<span class="ox-tag">Why not</span>`;
      return `<div class="ox ${isC ? "ok" : isP ? "bad" : ""}"><div class="ox-h"><span class="letter">${String.fromCharCode(65+i)}</span>${c} ${tag}</div><div class="ox-e">${q.optExpl[i]}</div></div>`;
    }).join("") + `</div>`;
  }

  function renderQuiz(){
    const quiz = state.quiz;
    const q = quiz.questions[quiz.index];
    const total = quiz.questions.length;
    const pct = Math.round((quiz.index / total) * 100);

    const choicesHtml = q.choices.map((choice, i) => {
      let cls = "choice";
      if (quiz.answered){
        if (i === q.correctIndex) cls += " correct";
        else if (i === quiz.selected) cls += " incorrect";
      }
      return `<button class="${cls}" data-i="${i}" ${quiz.answered ? "disabled" : ""}>
        <span class="letter">${String.fromCharCode(65+i)}</span>${choice}
      </button>`;
    }).join("");

    let feedbackHtml = "";
    if (quiz.answered){
      const wasRight = quiz.selected === q.correctIndex;
      feedbackHtml = `
        <div class="feedback ${wasRight ? "right" : "wrong"}">
          <span class="verdict">${wasRight ? "Correct" : "Incorrect"}</span>
          ${q.optExpl ? optBreakdown(q, quiz.selected) : q.explanation}
          <div><a class="resource-link" href="${q.resource.url}" target="_blank" rel="noopener">&#8250; Study more: ${q.resource.label}</a></div>
        </div>`;
    }

    app.innerHTML = `
      ${header()}
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="card">
        <div class="q-meta">
          <span class="q-num">Question ${quiz.index+1} / ${total} &middot; ${quiz.label}</span>
          ${quiz.timed ? `<span class="pill timer-pill" id="timer-display">${formatTime(quiz.secondsRemaining)}</span>` : ""}
          <span class="q-domain-badge" style="border-color:${domainColor(q.domain)}; color:${domainColor(q.domain)}">${domainShort(q.domain)}</span>
        </div>
        <div class="q-text">${q.question}</div>
        ${choicesHtml}
        ${feedbackHtml}
        <div class="btn-row">
          <button class="btn btn-ghost" id="quit-btn">Exit to menu</button>
          <button class="btn btn-primary" id="next-btn" ${quiz.answered ? "" : "disabled style='opacity:0.4;cursor:not-allowed'"}>${quiz.index+1===total ? "See results" : "Next question"}</button>
        </div>
      </div>
    `;

    if (!quiz.answered){
      app.querySelectorAll(".choice").forEach(btn => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.getAttribute("data-i"), 10);
          quiz.selected = i;
          quiz.answered = true;
          quiz.answers.push({ domain: q.domain, correct: i === q.correctIndex, question: q.question, explanation: q.explanation, resource: q.resource, chosen: q.choices[i], correctChoice: q.choices[q.correctIndex], chosenWhy: q.optExpl && i !== q.correctIndex ? q.optExpl[i] : null });
          if (q.bankId != null) recordBank(q.bankId, i === q.correctIndex);
          render();
        });
      });
    }
    document.getElementById("quit-btn").addEventListener("click", () => {
      if (quiz.timerId){ clearInterval(quiz.timerId); quiz.timerId = null; }
      const f = quiz.domainFilter; state.view = (f && (f.indexOf(WEAK_PREFIX)===0 || f===PORTS_KEY || f===FIREWALL_KEY)) ? "weak" : (f && f.indexOf(BANK_PREFIX)===0) ? "bank" : "home";
      render();
    });
    const nextBtn = document.getElementById("next-btn");
    nextBtn.addEventListener("click", () => {
      if (!quiz.answered) return;
      if (quiz.index + 1 < total){
        quiz.index += 1;
        quiz.answered = false;
        quiz.selected = null;
        render();
      } else {
        finishQuiz();
      }
    });
  }

  async function finishQuiz(){
    const quiz = state.quiz;
    if (quiz.timerId){ clearInterval(quiz.timerId); quiz.timerId = null; }
    const correct = quiz.answers.filter(a => a.correct).length;
    const total = quiz.answers.length;
    const byDomain = {};
    quiz.answers.forEach(a => {
      if (!byDomain[a.domain]) byDomain[a.domain] = { correct: 0, total: 0 };
      byDomain[a.domain].total += 1;
      if (a.correct) byDomain[a.domain].correct += 1;
    });
    const elapsedSeconds = Math.round((Date.now() - quiz.startedAt) / 1000);
    const record = { date: new Date().toISOString(), label: quiz.label, correct, total, byDomain, timed: quiz.timed, timedOut: quiz.timedOut, elapsedSeconds };
    await saveAttempt(record);
    state.view = "results";
    state.results = { answers: quiz.answers, correct, total, byDomain, label: quiz.label, timed: quiz.timed, timedOut: quiz.timedOut, elapsedSeconds };
    render();
  }

  function renderResults(){
    const r = state.results;
    const pct = Math.round((r.correct / r.total) * 100);
    const domainRows = Object.keys(r.byDomain).map(dk => {
      const d = r.byDomain[dk];
      const p = Math.round((d.correct / d.total) * 100);
      const cls = p >= 80 ? "" : p >= 60 ? "mid" : "weak";
      return `<div class="db-row">
        <div class="db-name">${domainShort(dk)}</div>
        <div class="db-track"><div class="db-fill ${cls}" style="width:${p}%; background:${p<60?'var(--red)':p<80?'var(--amber)':domainColor(dk)}"></div></div>
        <div class="db-pct">${d.correct}/${d.total}</div>
      </div>`;
    }).join("");

    const missed = r.answers.filter(a => !a.correct);
    const reviewHtml = r.answers.map(a => `
      <div class="review-item">
        <div class="review-q"><span class="review-tag ${a.correct ? "right" : "wrong"}">${a.correct ? "CORRECT" : "MISSED"}</span>${a.question}</div>
        <div class="muted">Your answer: ${a.chosen}${a.correct ? "" : ` &mdash; Correct answer: ${a.correctChoice}`}</div>
        ${a.chosenWhy ? `<div class="muted" style="margin-top:6px;"><b class="pct-bad">Why yours is wrong:</b> ${a.chosenWhy}</div>` : ""}
        <div class="muted" style="margin-top:6px;">${a.chosenWhy ? `<b class="pct-good">Why the answer is right:</b> ` : ""}${a.explanation}</div>
        <div><a class="resource-link" href="${a.resource.url}" target="_blank" rel="noopener">&#8250; ${a.resource.label}</a></div>
      </div>
    `).join("");

    app.innerHTML = `
      ${header()}
      <div class="card">
        <div class="score-hero">
          <div class="big">${r.correct}/${r.total}</div>
          <div class="label">${pct}% &middot; ${r.label}${r.elapsedSeconds != null ? ` &middot; completed in ${formatTime(r.elapsedSeconds)}` : ""}</div>
        </div>
        ${r.timedOut ? `<div class="feedback wrong" style="margin-top:14px;"><span class="verdict">Time expired</span>The 90-minute timer ran out before you finished. Remaining questions were marked as unanswered/incorrect below \u2014 just like the real exam, unanswered items count against you.</div>` : ""}
        <div class="domain-breakdown">${domainRows}</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="home-btn">Back to menu</button>
          <button class="btn btn-primary" id="retry-btn">Retake (new random order)</button>
        </div>
      </div>
      <div class="card">
        <h2>Review &mdash; ${missed.length} to revisit</h2>
        ${reviewHtml}
      </div>
      <div class="footer-note">Score saved to your attempt history. Take this test again anytime &mdash; order reshuffles every time.</div>
    `;

    document.getElementById("home-btn").addEventListener("click", () => { const f = state.quiz && state.quiz.domainFilter; state.view = (f && (f.indexOf(WEAK_PREFIX)===0 || f===PORTS_KEY || f===FIREWALL_KEY)) ? "weak" : (f && f.indexOf(BANK_PREFIX)===0) ? "bank" : "home"; render(); });
    document.getElementById("retry-btn").addEventListener("click", () => {
      const filter = state.quiz.domainFilter;
      const label = state.quiz.label;
      const timed = state.quiz.timed;
      startQuiz(filter, label, timed);
    });
  }

  function render(){
    if (state.view === "home") renderHome();
    else if (state.view === "quiz") renderQuiz();
    else if (state.view === "results") renderResults();
    else if (state.view === "analysis") renderAnalysis();
    else if (state.view === "weak") renderWeak();
    else if (state.view === "flash") renderFlash();
    else if (state.view === "bank") renderBank();
    else if (state.view === "plan") renderPlan();
  }

  (async function init(){
    app.innerHTML = `${header()}<div class="card muted">Loading your attempt history&hellip;</div>`;
    await loadHistory();
    render();
  })();
})();

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(console.error);
  });
}
</script>
</body>
</html>
