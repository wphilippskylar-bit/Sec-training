etween a provider and customer.", "resource": {"label": "Agreement Types (SY0-701 5.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "Two organizations that want to share threat intelligence sign a document establishing a general understanding of cooperation, without creating a legally binding, detailed contractual obligation. What is this called?", "choices": ["Memorandum of understanding (MOU)", "Service level agreement (SLA)", "Non-disclosure agreement (NDA)", "Master service agreement (MSA)"], "correct": 0, "explanation": "A memorandum of understanding (MOU) documents a mutual understanding and intent to cooperate between parties, typically less formal and legally binding than a full contract like an SLA or MSA.", "resource": {"label": "Agreement Types (SY0-701 5.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A healthcare organization must ensure it follows all requirements of HIPAA regarding the protection of patient health information. This requirement is an example of what?", "choices": ["A regulatory compliance requirement", "A voluntary best practice", "A risk transference strategy", "A compensating control"], "correct": 0, "explanation": "Regulatory compliance requirements, such as HIPAA for healthcare data, are legally mandated obligations that organizations must follow, as opposed to optional best practices, and often carry legal penalties for non-compliance.", "resource": {"label": "Compliance (SY0-701 5.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "An organization hires an independent, external firm to formally evaluate whether its security controls meet a specific regulatory framework, and the firm issues a signed report of its findings. What is this process called?", "choices": ["An internal audit", "An external audit", "A tabletop exercise", "A vulnerability scan"], "correct": 1, "explanation": "An external audit is conducted by an independent third party outside the organization, providing an objective assessment of compliance with regulations or standards, which often carries more credibility with regulators and customers than a self-conducted internal audit.", "resource": {"label": "Audits and Assessments (SY0-701 5.5)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "Which type of assessment specifically compares an organization's current security posture against a recognized framework or set of best practices to identify gaps that need remediation?", "choices": ["Gap analysis", "Penetration test", "Fuzzing", "Tabletop exercise"], "correct": 0, "explanation": "A gap analysis compares current practices and controls against a target framework or standard, identifying the specific differences (\"gaps\") that must be addressed to achieve compliance or a desired security posture.", "resource": {"label": "Governance and Gap Analysis (SY0-701 5.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "An organization sends simulated phishing emails to its employees each quarter and provides additional training to anyone who clicks the link. What is the primary purpose of this program?", "choices": ["To punish employees who make mistakes", "To measure and improve employee awareness and reduce susceptibility to phishing", "To satisfy a data backup requirement", "To test network firewall rules"], "correct": 1, "explanation": "Simulated phishing campaigns are a component of security awareness training designed to measure how susceptible employees are to phishing and to provide targeted, reinforcing education, rather than to penalize individuals.", "resource": {"label": "Security Awareness (SY0-701 5.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "Which framework, developed by the U.S. government, provides a widely adopted set of guidelines organizations can use to identify, protect, detect, respond to, and recover from cybersecurity risks?", "choices": ["NIST Cybersecurity Framework", "PCI DSS", "GDPR", "ISO 9001"], "correct": 0, "explanation": "The NIST Cybersecurity Framework (CSF) offers voluntary guidance organized around core functions (Identify, Protect, Detect, Respond, Recover) that organizations across industries can use to manage and reduce cybersecurity risk.", "resource": {"label": "Governance and Frameworks (SY0-701 5.1)", "url": "https://csrc.nist.gov/projects/risk-management"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A company that processes credit card payments must comply with a specific industry-mandated security standard covering how cardholder data is stored, processed, and transmitted. Which standard is this?", "choices": ["PCI DSS", "HIPAA", "FERPA", "SOX"], "correct": 0, "explanation": "The Payment Card Industry Data Security Standard (PCI DSS) is an industry-mandated standard (not a government law) that defines security requirements for any organization that stores, processes, or transmits credit card data.", "resource": {"label": "Compliance (SY0-701 5.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "During due diligence before a merger, one company reviews the other company's security posture, including past incidents, existing controls, and outstanding risks, to inform the acquisition decision. What is this process best described as?", "choices": ["Third-party/supply chain risk assessment", "Penetration testing", "Business continuity testing", "A tabletop exercise"], "correct": 0, "explanation": "Evaluating a partner or acquisition target's security posture as part of due diligence is a form of third-party and supply chain risk assessment, helping the acquiring organization understand risks it may be inheriting.", "resource": {"label": "Third-Party Risk Management (SY0-701 5.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "A secure facility requires visitors to pass through a small enclosed space with two interlocking doors, where the second door won't open until the first is closed. What is this control called?", "choices": ["Mantrap", "Bollard", "Honeynet", "Screened subnet"], "correct": 0, "explanation": "A mantrap is a preventive physical control consisting of two interlocking doors that only allow one to open at a time, preventing tailgating and controlling entry one person at a time.", "resource": {"label": "Physical Security (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "After a break-in, a security team reviews weeks of CCTV footage to identify how the intruder gained access. What category of control does reviewing recorded video footage represent?", "choices": ["Preventive", "Detective", "Deterrent", "Directive"], "correct": 1, "explanation": "Detective controls identify that an event occurred, often after the fact, such as reviewing camera footage or audit logs. They don't stop the event but help investigate and respond to it.", "resource": {"label": "Security Controls (SY0-701 1.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/security-controls-sy0-701/"}}, {"domain": "1.0 General Security Concepts", "question": "Following a ransomware infection, an organization restores affected servers from a known-good backup to return systems to normal operation. What category of control does this restoration represent?", "choices": ["Corrective", "Deterrent", "Compensating", "Directive"], "correct": 0, "explanation": "A corrective control acts after an incident to restore systems or reduce further damage, such as restoring from backup or applying a patch. This differs from a preventive control, which tries to stop the event before it happens.", "resource": {"label": "Security Controls (SY0-701 1.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/security-controls-sy0-701/"}}, {"domain": "1.0 General Security Concepts", "question": "A company encrypts customer records stored on its file servers so that even if an attacker steals the physical drives, the data cannot be read. Which part of the CIA triad does this primarily protect?", "choices": ["Confidentiality", "Integrity", "Availability", "Non-repudiation"], "correct": 0, "explanation": "Confidentiality ensures that only authorized parties can view data. Encrypting stored data protects it from being read by anyone who gains unauthorized physical or logical access to the storage media.", "resource": {"label": "The CIA Triad (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "A data center installs dual redundant power supplies and an uninterruptible power supply for each critical server. Which part of the CIA triad does this primarily support?", "choices": ["Confidentiality", "Integrity", "Availability", "Accounting"], "correct": 2, "explanation": "Availability ensures authorized users can access systems and data when needed. Redundant power and UPS systems reduce the chance that a power failure takes critical systems offline.", "resource": {"label": "The CIA Triad (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "In the AAA framework, which step occurs after a user successfully proves their identity and determines what resources that user is permitted to access?", "choices": ["Authentication", "Authorization", "Accounting", "Attestation"], "correct": 1, "explanation": "Authorization happens after authentication and determines what an already-verified user is allowed to do or access. Accounting then records what the user actually did during the session.", "resource": {"label": "Authentication Methods (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "An organization compares its current security practices against the ISO 27001 framework to identify areas where it falls short before pursuing certification. What is this comparison process called?", "choices": ["Gap analysis", "Penetration testing", "Risk transference", "Change management"], "correct": 0, "explanation": "A gap analysis measures the difference between an organization's current state and a target framework or standard, highlighting specific gaps that must be closed, often as a precursor to formal certification or audit.", "resource": {"label": "Governance and Gap Analysis (SY0-701 5.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "A corporate campus installs perimeter fencing and bright security lighting around its parking areas at night. What is the primary security purpose of this combination?", "choices": ["To detect intrusions after they occur", "To deter and delay unauthorized physical access", "To recover data after a breach", "To authenticate employees at the door"], "correct": 1, "explanation": "Fencing and lighting are physical controls that primarily deter potential intruders and slow down or funnel physical access attempts, working alongside detective controls like cameras and guards.", "resource": {"label": "Physical Security (SY0-701 1.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "Before rolling out a firewall rule change to production, an administrator documents a specific backout plan describing exactly how to reverse the change if something goes wrong. Why is a backout plan a required part of change management?", "choices": ["It replaces the need for testing", "It allows a rapid return to a known-good state if the change causes problems", "It is only needed for cosmetic changes", "It eliminates the need for approval from a change advisory board"], "correct": 1, "explanation": "A backout (rollback) plan ensures that if a change causes unexpected issues, the team can quickly and reliably restore the previous working configuration, minimizing downtime and risk.", "resource": {"label": "Change Management (SY0-701 1.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "Two employees use the same key to both encrypt and decrypt a shared file. What type of encryption does this describe?", "choices": ["Symmetric encryption", "Asymmetric encryption", "Hashing", "Tokenization"], "correct": 0, "explanation": "Symmetric encryption uses a single shared key for both encryption and decryption, making it fast but requiring a secure way to distribute that key. Asymmetric encryption instead uses a mathematically linked public/private key pair.", "resource": {"label": "Cryptographic Solutions (SY0-701 1.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "1.0 General Security Concepts", "question": "A file is run through the SHA-256 algorithm before and after being transferred, and the two resulting values are compared to confirm the file wasn't altered in transit. What is this technique verifying?", "choices": ["Confidentiality", "Integrity", "Availability", "Non-repudiation"], "correct": 1, "explanation": "Hashing algorithms like SHA-256 produce a fixed-size fingerprint of data; comparing hash values before and after transfer verifies integrity, confirming the data was not modified. Hashing does not encrypt or hide the data's content.", "resource": {"label": "Cryptographic Solutions (SY0-701 1.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A well-funded attacker with access to custom tools and significant time spends months quietly infiltrating a government agency's network to steal classified data. Which threat actor category best fits this description?", "choices": ["Script kiddie", "Nation-state actor", "Hacktivist", "Shadow IT user"], "correct": 1, "explanation": "Nation-state actors are typically well-resourced, highly skilled, and patient, often conducting long-term advanced persistent threat (APT) campaigns for espionage or strategic advantage, unlike lower-skill opportunistic attackers.", "resource": {"label": "Threat Actors (SY0-701 2.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker defaces a company's website and leaks internal emails to protest the company's environmental policies. What motivation best describes this attacker?", "choices": ["Financial gain", "Ideological/political (hacktivism)", "Espionage", "Personal revenge from a former employee"], "correct": 1, "explanation": "Hacktivists are motivated by political or social causes rather than direct financial gain, using attacks like defacement or leaks to draw attention to or protest an issue.", "resource": {"label": "Threat Actor Motivations (SY0-701 2.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An employee sets up an unauthorized personal cloud storage account to sync work files because the approved corporate tool feels too slow. What security concern does this represent?", "choices": ["Shadow IT", "A watering hole attack", "A supply chain attack", "Typosquatting"], "correct": 0, "explanation": "Shadow IT refers to the use of unauthorized systems, applications, or services within an organization, which expands the attack surface and creates blind spots for the security team since these tools aren't monitored or vetted.", "resource": {"label": "Attack Surface (SY0-701 2.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker calls an employee, claiming to be from the IT help desk, and urgently asks them to read back a one-time passcode they just received by text. What social engineering technique is this?", "choices": ["Vishing", "Smishing", "Typosquatting", "Watering hole attack"], "correct": 0, "explanation": "Vishing (voice phishing) uses a phone call to manipulate a victim into revealing sensitive information or performing an action, often by creating a false sense of urgency or authority.", "resource": {"label": "Social Engineering (SY0-701 2.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An employee receives a text message claiming to be from their bank, containing a link to \"verify\" their account information. What social engineering technique is this?", "choices": ["Smishing", "Vishing", "Pretexting", "Business email compromise"], "correct": 0, "explanation": "Smishing is phishing conducted via SMS text message, often including a malicious link or a request for sensitive information, relying on the immediacy and perceived trust of text messages.", "resource": {"label": "Social Engineering (SY0-701 2.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker impersonates a company's CEO in an email to the finance department, urgently requesting an unusual wire transfer to a new account. What is this type of attack called?", "choices": ["Business email compromise (BEC)", "Watering hole attack", "Credential stuffing", "ARP spoofing"], "correct": 0, "explanation": "Business email compromise involves impersonating a trusted executive or partner via email, typically to trick an employee into making a fraudulent wire transfer or disclosing sensitive data.", "resource": {"label": "Social Engineering (SY0-701 2.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker registers the domain \"micros0ft-support.com\" (using a zero instead of an o) to trick users who mistype the real Microsoft domain. What is this technique called?", "choices": ["Typosquatting", "Pharming", "Tailgating", "Whaling"], "correct": 0, "explanation": "Typosquatting registers domain names that are common misspellings of legitimate sites, hoping to capture traffic or credentials from users who make a typing mistake.", "resource": {"label": "Social Engineering (SY0-701 2.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Malware that automatically copies itself across a network without requiring any user interaction or a host file to attach to is best classified as which type of malware?", "choices": ["Worm", "Trojan", "Logic bomb", "Rootkit"], "correct": 0, "explanation": "A worm is self-replicating malware that spreads across networks on its own, exploiting vulnerabilities without needing a user to run an infected file, unlike a Trojan, which requires the user to install it.", "resource": {"label": "Malware Types (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Malware secretly installed on an employee's laptop records every keystroke they type, including passwords, and sends the data to an attacker. What type of malware is this?", "choices": ["Keylogger", "Worm", "Logic bomb", "Rootkit"], "correct": 0, "explanation": "A keylogger is a form of spyware that captures and exfiltrates keystrokes, often to steal credentials, financial information, or other sensitive data typed by the victim.", "resource": {"label": "Malware Types (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker encrypts all the files on a hospital's servers and demands payment in cryptocurrency before providing the decryption key. What type of malware is this?", "choices": ["Ransomware", "Adware", "A rootkit", "A logic bomb"], "correct": 0, "explanation": "Ransomware encrypts a victim's data (or threatens to leak it) and demands payment, typically in cryptocurrency, in exchange for restoring access. Backups and segmentation are key defenses against its impact.", "resource": {"label": "Malware Types (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A web application fails to sanitize user comments before displaying them to other visitors, allowing an attacker to embed malicious JavaScript that runs in other users' browsers. What is this vulnerability called?", "choices": ["Cross-site scripting (XSS)", "SQL injection", "Directory traversal", "Buffer overflow"], "correct": 0, "explanation": "Cross-site scripting occurs when an application allows untrusted input to be rendered as executable script in another user's browser, which can be used to steal session cookies or perform actions as the victim.", "resource": {"label": "Application Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker tricks a logged-in user's browser into unknowingly submitting a request to a banking site, using the victim's own active session to transfer funds without their knowledge. What is this attack called?", "choices": ["Cross-site request forgery (CSRF)", "Cross-site scripting (XSS)", "SQL injection", "Replay attack"], "correct": 0, "explanation": "Cross-site request forgery exploits an authenticated user's active session by tricking their browser into submitting an unwanted request to a site they're logged into, without the user's consent or knowledge.", "resource": {"label": "Application Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker manipulates a URL's file path parameter, using sequences like \"../../\" to access files outside the web server's intended directory. What is this attack called?", "choices": ["Directory traversal", "Cross-site scripting", "Race condition", "Pass the hash"], "correct": 0, "explanation": "Directory traversal exploits insufficient input validation to move outside a web application's intended root directory, potentially exposing sensitive files elsewhere on the server's file system.", "resource": {"label": "Application Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A low-privileged user on a system discovers and exploits a flaw that grants them administrator-level access. What is this attack called?", "choices": ["Privilege escalation", "Credential stuffing", "Pharming", "Typosquatting"], "correct": 0, "explanation": "Privilege escalation occurs when an attacker exploits a vulnerability or misconfiguration to gain a higher level of access than they were originally granted, often moving from a standard user to an administrator.", "resource": {"label": "Application Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker captures a valid, encrypted authentication request between a user and a server, then resends it later to impersonate the user without needing to know the actual password. What is this attack called?", "choices": ["Replay attack", "On-path attack", "DNS poisoning", "Password spraying"], "correct": 0, "explanation": "A replay attack captures legitimate data (such as an authentication token) and retransmits it later to fraudulently gain access, without the attacker ever needing to decrypt or know the original credentials.", "resource": {"label": "Network Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker on a local network sends forged messages associating their own MAC address with the IP address of the default gateway, causing other devices to send traffic to the attacker instead. What is this attack called?", "choices": ["ARP spoofing", "DNS poisoning", "Credential stuffing", "Smishing"], "correct": 0, "explanation": "ARP spoofing (or ARP poisoning) sends forged Address Resolution Protocol messages to associate the attacker's MAC address with another device's IP address, enabling traffic interception on a local network.", "resource": {"label": "Network Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "An attacker compromises a DNS server's cache so that requests for a legitimate banking domain are silently redirected to a malicious look-alike site. What is this attack called?", "choices": ["DNS poisoning", "ARP spoofing", "Credential stuffing", "A watering hole attack"], "correct": 0, "explanation": "DNS poisoning (or cache poisoning) corrupts DNS resolution records so that a legitimate domain name resolves to an attacker-controlled IP address, redirecting victims without any visible change to the URL they typed.", "resource": {"label": "Network Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "Instead of trying every possible password combination one character at a time, an attacker uses a precomputed table of hash values to quickly reverse a stolen password hash back into plaintext. What is this attack called?", "choices": ["A rainbow table attack", "Password spraying", "Credential stuffing", "Typosquatting"], "correct": 0, "explanation": "A rainbow table attack uses precomputed tables mapping hash values back to their original plaintext, dramatically speeding up password cracking compared to brute force, though salting passwords effectively defeats this technique.", "resource": {"label": "Password Attacks (SY0-701 2.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A cloud storage bucket containing customer files is accidentally left open to public read access due to an incorrect setting. What type of vulnerability does this represent?", "choices": ["Zero-day vulnerability", "Misconfiguration", "Race condition", "Buffer overflow"], "correct": 1, "explanation": "A misconfiguration vulnerability arises when a system or service is set up incorrectly, such as an overly permissive cloud storage policy, exposing data or systems that should have been restricted.", "resource": {"label": "Vulnerability Types (SY0-701 2.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "2.0 Threats, Vulnerabilities, and Mitigations", "question": "A company's application uses a popular open-source code library that is later found to contain malicious code inserted by an attacker who compromised the library's build process. What type of vulnerability does this represent?", "choices": ["Supply chain vulnerability", "Legacy platform vulnerability", "Race condition", "Misconfiguration"], "correct": 0, "explanation": "A supply chain vulnerability arises when a trusted third-party component, vendor, or dependency is compromised, introducing risk into every organization that relies on it, even though the victim organization made no direct mistake.", "resource": {"label": "Vulnerability Types (SY0-701 2.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A development team runs its application code in a cloud environment where the provider automatically manages the underlying servers, and the team is billed only for the compute time actually used. What is this model called?", "choices": ["Serverless computing", "Infrastructure as code", "On-premises hosting", "Air gapping"], "correct": 0, "explanation": "Serverless computing lets developers run code without provisioning or managing servers directly; the cloud provider handles the underlying infrastructure, and billing is typically based on actual execution time.", "resource": {"label": "Cloud Infrastructure Concepts (SY0-701 3.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A cloud network uses centralized software controllers to dynamically manage traffic flow and routing policies across virtual switches, separate from the physical hardware. What networking concept is this?", "choices": ["Software defined networking (SDN)", "Infrastructure as code", "RAID", "Port security"], "correct": 0, "explanation": "Software defined networking separates the network's control plane from the data plane, allowing centralized, programmable management of traffic flow and policy, which is especially useful in cloud and virtualized environments.", "resource": {"label": "Cloud Infrastructure Concepts (SY0-701 3.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "In a cloud computing shared responsibility model, which of the following is typically the customer's responsibility, even when using a fully managed Infrastructure as a Service (IaaS) offering?", "choices": ["Physical security of the data center", "Configuring access controls and encrypting their own data", "Maintaining the physical network hardware", "Patching the hypervisor"], "correct": 1, "explanation": "Under the shared responsibility model, the cloud provider secures the underlying infrastructure (physical security, hypervisor, hardware), while the customer remains responsible for securing what they put in the cloud, including data, access controls, and configurations.", "resource": {"label": "Cloud Infrastructure Concepts (SY0-701 3.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A network is divided into logical zones labeled \"trusted,\" \"untrusted,\" and \"internal,\" and traffic between zones is governed by specific policies rather than treating the whole network as one flat space. What concept does this describe?", "choices": ["Security zones", "RAID", "Tokenization", "Key escrow"], "correct": 0, "explanation": "Security zones group network segments by trust level, allowing administrators to apply different policies to traffic moving between zones (for example, blocking untrusted-to-trusted traffic by default) rather than relying on a single flat network.", "resource": {"label": "Infrastructure Considerations (SY0-701 3.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "Which infrastructure approach completely physically isolates a highly sensitive network from any other network, including the internet, with no direct connection at all?", "choices": ["Air gapping", "A screened subnet", "A VPN", "SD-WAN"], "correct": 0, "explanation": "Air gapping physically separates a system or network from all other networks, including the internet, providing very strong isolation at the cost of convenience, commonly used for extremely sensitive systems like industrial control systems.", "resource": {"label": "Infrastructure Considerations (SY0-701 3.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "An organization deploys a device that distributes incoming web traffic across several identical servers so that no single server becomes overwhelmed and the application stays available if one server fails. What is this device called?", "choices": ["A load balancer", "A jump server", "A honeypot", "A WAF"], "correct": 0, "explanation": "A load balancer distributes traffic across multiple servers to improve performance and availability, and it can also reroute traffic away from a failed server automatically, supporting both efficiency and resilience.", "resource": {"label": "Infrastructure Considerations (SY0-701 3.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "Administrators must first connect to a hardened, tightly monitored host before being allowed to reach any servers on a sensitive internal network segment. What is this hardened host called?", "choices": ["A jump server (bastion host)", "A load balancer", "A screened subnet", "A honeynet"], "correct": 0, "explanation": "A jump server (or bastion host) is a hardened system that acts as the single controlled gateway administrators must pass through to reach a sensitive network, centralizing monitoring and reducing direct exposure of internal systems.", "resource": {"label": "Infrastructure Considerations (SY0-701 3.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "Which type of firewall operates specifically at the application layer to inspect and filter HTTP/HTTPS traffic, protecting web applications from attacks like SQL injection and cross-site scripting?", "choices": ["Web application firewall (WAF)", "Packet-filtering firewall", "Circuit-level gateway", "Stateless firewall"], "correct": 0, "explanation": "A web application firewall inspects application-layer (Layer 7) HTTP/HTTPS traffic specifically, filtering out malicious requests targeting web application vulnerabilities, unlike a traditional firewall that mainly filters based on ports and addresses.", "resource": {"label": "Firewall Types (SY0-701 3.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/firewall-types-sy0-701/"}}, {"domain": "3.0 Security Architecture", "question": "An administrator connects to a remote Linux server to run commands, with the entire session encrypted end-to-end over a single, purpose-built protocol. What protocol is most likely being used?", "choices": ["SSH", "FTP", "Telnet", "SNMPv1"], "correct": 0, "explanation": "SSH (Secure Shell) provides an encrypted channel for remote command-line access and file transfer, replacing older unencrypted protocols like Telnet and FTP that transmit credentials and data in plaintext.", "resource": {"label": "Secure Communication (SY0-701 3.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A company encrypts the entire hard drive of every corporate laptop so that if a device is lost or stolen, the data on it cannot be read without the correct credentials. What are they protecting?", "choices": ["Data at rest", "Data in transit", "Data in use", "Data in escrow"], "correct": 0, "explanation": "Data at rest refers to data stored on a device or medium, such as a hard drive, and full disk encryption is a common control used to protect it from unauthorized access if the device is lost, stolen, or improperly disposed of.", "resource": {"label": "Data Protection (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A company enforces that all traffic between its web servers and customers' browsers must use TLS 1.2 or higher. What are they primarily protecting?", "choices": ["Data at rest", "Data in transit", "Data in use", "Data in escrow"], "correct": 1, "explanation": "Data in transit refers to data actively moving across a network, and protocols like TLS encrypt that data so it can't be read or tampered with by anyone intercepting the traffic along the way.", "resource": {"label": "Data Protection (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A customer service application displays a customer's credit card number to support staff as \"**** **** **** 4321,\" showing only the last four digits. What data protection technique is this?", "choices": ["Data masking", "Tokenization", "Full disk encryption", "Hashing"], "correct": 0, "explanation": "Data masking obscures portions of sensitive data (such as showing only the last four digits of a card number) so that staff can reference a record without being exposed to the full sensitive value.", "resource": {"label": "Data Protection (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "An organization sets a goal that after a major outage, a critical application must be back online and usable within four hours. Which metric does this describe?", "choices": ["Recovery time objective (RTO)", "Recovery point objective (RPO)", "Mean time between failures (MTBF)", "Annualized rate of occurrence (ARO)"], "correct": 0, "explanation": "Recovery time objective (RTO) defines the maximum acceptable length of time a system can be down after a disruption before it must be restored. It answers \"how fast do we need to be back up,\" while RPO answers \"how much data can we afford to lose.\"", "resource": {"label": "Resilience and Recovery (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A company maintains a backup facility with basic power, cooling, and network connectivity already in place, but no live servers or data, requiring significant setup time before it could take over operations. What is this called?", "choices": ["A warm site", "A hot site", "A cold site", "A honeynet"], "correct": 2, "explanation": "A cold site provides only basic infrastructure like power, cooling, and space, with no pre-installed systems or current data, meaning it takes considerably longer to become operational compared to a hot or warm site.", "resource": {"label": "Resilience and Recovery (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "A company replicates its production database in real time to a data center located in a different geographic region, so that a regional disaster affecting one location won't take down the other. What resilience concept is this?", "choices": ["Geographic dispersion", "Data masking", "Tokenization", "Load balancing"], "correct": 0, "explanation": "Geographic dispersion spreads critical infrastructure or data across physically distant locations, reducing the risk that a single regional event (natural disaster, power grid failure, etc.) could disrupt all copies of a system simultaneously.", "resource": {"label": "Resilience and Recovery (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "3.0 Security Architecture", "question": "An organization performs a full backup on Sunday, and then each following day backs up only the files that changed since Sunday's full backup, meaning Thursday's backup includes every change made since Sunday, not just since Wednesday. What backup type is this?", "choices": ["Differential backup", "Incremental backup", "Snapshot only", "Full backup only"], "correct": 0, "explanation": "A differential backup captures all changes made since the last full backup, so each successive differential grows larger but a restore only requires the full backup plus the single most recent differential, unlike incremental backups which require every increment since the last full backup.", "resource": {"label": "Resilience and Recovery (SY0-701 3.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A penetration tester is given no advance information about the target's internal network, applications, or credentials before testing begins, simulating an external attacker with no inside knowledge. What type of test is this?", "choices": ["Black-box test", "White-box test", "Gray-box test", "A vulnerability scan only"], "correct": 0, "explanation": "A black-box test gives the tester no internal knowledge of the target system, simulating the perspective of an external attacker starting from scratch, in contrast to a white-box test where full internal details are provided.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A penetration tester is given limited information, such as basic network diagrams and a single low-privileged user account, but not full source code or administrative access. What type of test is this?", "choices": ["Gray-box test", "White-box test", "Black-box test", "A tabletop exercise"], "correct": 0, "explanation": "A gray-box test provides the tester with partial knowledge of the environment, striking a balance between the full transparency of a white-box test and the complete blindness of a black-box test.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Before a penetration test begins, the client and testing firm sign a document specifying the exact scope, timing, systems that may be tested, and techniques that are off-limits. What is this document called?", "choices": ["Rules of engagement", "A risk register", "A service level agreement", "A memorandum of understanding"], "correct": 0, "explanation": "The rules of engagement define the boundaries, scope, and permitted techniques for a penetration test, protecting both the client and the tester by clarifying exactly what is authorized before testing begins.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A software company offers monetary rewards to independent researchers who responsibly disclose previously unknown vulnerabilities in its products. What is this program called?", "choices": ["A bug bounty program", "A tabletop exercise", "Rules of engagement", "A risk register"], "correct": 0, "explanation": "A bug bounty program incentivizes external security researchers to find and responsibly report vulnerabilities in exchange for a reward, extending an organization's vulnerability discovery efforts beyond its internal team.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "An organization establishes a recurring process to identify newly released vendor updates, test them in a staging environment, and then deploy them to production systems on a defined schedule. What process is this?", "choices": ["Patch management", "Change management only", "Incident response", "Risk transference"], "correct": 0, "explanation": "Patch management is the ongoing process of identifying, testing, and deploying software updates to fix known vulnerabilities, and it typically operates within the broader change management process to ensure updates are controlled and tested.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Which standard defines a common framework and set of specifications for automating vulnerability management, measurement, and policy compliance across different security tools?", "choices": ["SCAP (Security Content Automation Protocol)", "CVSS", "CVE", "PKI"], "correct": 0, "explanation": "SCAP is a suite of specifications that standardizes how vulnerability and configuration information is communicated between different automated security tools, enabling consistent scanning and compliance checking across an organization.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A security team runs an automated tool that identifies known vulnerabilities in a network without attempting to actually exploit them, producing a report of potential weaknesses. How does this activity primarily differ from a penetration test?", "choices": ["It attempts to actually exploit vulnerabilities to prove impact, unlike a scan", "It only identifies potential vulnerabilities, while a penetration test actively attempts to exploit them", "It requires no authorization, unlike a penetration test", "It can only be performed by external auditors"], "correct": 1, "explanation": "A vulnerability scan identifies and reports potential weaknesses without exploiting them, while a penetration test goes further by actively attempting to exploit vulnerabilities to demonstrate real-world impact.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A vulnerability scanner reports no issues on a server that, unknown to the team, actually has a critical unpatched vulnerability. What is this scan result called?", "choices": ["A false negative", "A false positive", "A true positive", "An indicator of compromise"], "correct": 0, "explanation": "A false negative occurs when a scan fails to detect a vulnerability that actually exists, which is more dangerous than a false positive because the organization is left with a false sense of security about that system.", "resource": {"label": "Vulnerability Management (SY0-701 4.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A security operations center is receiving thousands of low-priority alerts every day, causing analysts to miss the handful of alerts that indicate real threats. What is this problem commonly called?", "choices": ["Alert fatigue", "A false negative", "A zero-day vulnerability", "A compensating control"], "correct": 0, "explanation": "Alert fatigue occurs when analysts are overwhelmed by a high volume of alerts, many of which are low-value or false positives, increasing the risk that genuine, high-priority alerts get overlooked. Tuning detection rules and thresholds helps reduce this.", "resource": {"label": "Monitoring (SY0-701 4.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A SIEM platform collects logs from firewalls, servers, and endpoints into one central location so analysts don't need to check each system's logs individually. What is this specific capability called?", "choices": ["Log aggregation", "Fuzzing", "Tokenization", "Federation"], "correct": 0, "explanation": "Log aggregation is the process of collecting log data from many different sources into a single centralized platform, which is foundational to a SIEM's ability to correlate events and detect patterns across the environment.", "resource": {"label": "Monitoring (SY0-701 4.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A firewall rule set ends with a final rule that blocks any traffic not explicitly matched by an earlier allow rule. What principle is being applied here?", "choices": ["Implicit deny", "Least privilege", "Non-repudiation", "Federation"], "correct": 0, "explanation": "Implicit deny is the default-deny principle where any traffic not explicitly permitted by a rule is blocked, ensuring that only intentionally allowed traffic passes through the firewall.", "resource": {"label": "Firewalls, IDS, and IPS (SY0-701 4.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "An organization uses a filtering system to block employees from accessing known malicious or inappropriate websites based on category, such as gambling or malware-hosting sites. What is this technology called?", "choices": ["Content/URL filtering", "Data loss prevention", "Network access control", "Port security"], "correct": 0, "explanation": "Content or URL filtering blocks or allows access to websites based on category, reputation, or specific URL, commonly enforced at the firewall or a dedicated web security gateway.", "resource": {"label": "Network Security (SY0-701 4.5)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "An organization uses a centralized platform to enforce security policies, remotely wipe data, and push configuration profiles to employees' company-issued smartphones. What is this called?", "choices": ["Mobile device management (MDM)", "Containerization only", "Geofencing", "Full disk encryption only"], "correct": 0, "explanation": "Mobile device management (MDM) platforms allow organizations to centrally enforce security policies, distribute configurations, and remotely manage or wipe corporate mobile devices, whether company-owned or BYOD.", "resource": {"label": "Mobile Solutions (SY0-701 4.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A company configures its MDM policy so that a corporate app on employee smartphones only functions while the device is physically located within the company's campus. What mobile security feature is this?", "choices": ["Geofencing", "Containerization", "Full device encryption", "Jailbreak detection"], "correct": 0, "explanation": "Geofencing uses a device's location to enforce policy, such as restricting an app's functionality or access to a specific physical boundary, adding a location-based layer of control beyond traditional authentication.", "resource": {"label": "Mobile Solutions (SY0-701 4.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A user is granted access to a resource based partly on the fact that their login is coming from an approved corporate office network rather than an unfamiliar country. Which authentication factor category does this represent?", "choices": ["Something you know", "Something you have", "Something you are", "Somewhere you are"], "correct": 3, "explanation": "\"Somewhere you are\" is a location-based authentication factor that considers the user's physical or network location as part of the access decision, often used alongside other factors rather than as a sole method of authentication.", "resource": {"label": "Authentication Methods (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Two separate companies configure a trust relationship so that an employee from Company A can log into Company B's application using their existing Company A credentials, without Company B managing a separate account for them. What is this called?", "choices": ["Federation", "Single sign-on within one organization", "Privileged access management", "Role-based access control"], "correct": 0, "explanation": "Federation extends authentication trust across separate organizations or security domains, allowing users from one organization to access another's resources using their home organization's credentials, unlike SSO which typically applies within a single organization.", "resource": {"label": "Identity and Access Management (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "As part of a periodic access review, a manager must formally confirm, in writing, that each of their employees still requires the system access currently assigned to them. What identity process is this?", "choices": ["Attestation", "Provisioning", "Federation", "Deprovisioning"], "correct": 0, "explanation": "Attestation is the formal process of a responsible party reviewing and confirming that existing access rights are still appropriate, helping catch excessive or outdated permissions before they become a security risk.", "resource": {"label": "Identity and Access Management (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "A system automatically disables a user account for 30 minutes after five consecutive incorrect password attempts. What is the primary purpose of this control?", "choices": ["To slow down or stop brute-force password guessing attacks", "To satisfy a data retention requirement", "To enable federation with partner organizations", "To provide non-repudiation for transactions"], "correct": 0, "explanation": "Account lockout policies limit the number of failed login attempts allowed within a period, significantly slowing down brute-force and password-guessing attacks by locking the account before an attacker can try many combinations.", "resource": {"label": "Identity and Access Management (SY0-701 4.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Before any security incident occurs, an organization writes detailed incident response playbooks, assigns team roles, and stocks a forensic toolkit. Which phase of the incident response process does this represent?", "choices": ["Preparation", "Detection", "Containment", "Lessons learned"], "correct": 0, "explanation": "Preparation is the proactive phase of incident response that happens before an incident occurs, covering plans, tools, training, and communication procedures so the team is ready to respond effectively when something does happen.", "resource": {"label": "Incident Response Process (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "During an active malware outbreak, a response team disconnects the infected workstation from the network to stop it from spreading further, without yet removing the malware itself. Which phase of incident response does this represent?", "choices": ["Containment", "Preparation", "Eradication", "Lessons learned"], "correct": 0, "explanation": "Containment focuses on limiting the scope and spread of an active incident, such as isolating an infected host from the network, before moving on to fully removing the threat in the eradication phase.", "resource": {"label": "Incident Response Process (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "After isolating an infected system, the response team identifies and removes the malware, closes the vulnerability that allowed the initial infection, and verifies the system is clean. Which phase of incident response does this represent?", "choices": ["Eradication", "Containment", "Preparation", "Detection"], "correct": 0, "explanation": "Eradication involves fully removing the threat from affected systems and addressing the root cause that allowed the compromise, ensuring the same vulnerability can't be exploited again before systems are restored to production.", "resource": {"label": "Incident Response Process (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "During a forensic investigation, every person who handles a piece of evidence, and exactly when and how, is documented to ensure the evidence would hold up if used in legal proceedings. What is this documentation process called?", "choices": ["Chain of custody", "Order of volatility", "Attestation", "Non-repudiation"], "correct": 0, "explanation": "Chain of custody is the documented, unbroken record of who collected, handled, and stored evidence, and when, which is essential for proving the evidence wasn't altered or tampered with if it's later used in legal or disciplinary proceedings.", "resource": {"label": "Digital Forensics (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Anticipating a lawsuit, a company's legal team instructs IT to preserve all emails and files related to a specific project and suspend the normal automatic deletion schedule for that data. What is this called?", "choices": ["A legal hold", "A risk register", "A gap analysis", "A compensating control"], "correct": 0, "explanation": "A legal hold (or litigation hold) suspends the normal destruction or alteration of specific records because they may be relevant to anticipated or ongoing litigation, and IT teams must ensure that data is preserved accordingly.", "resource": {"label": "Digital Forensics (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "Which of the following data sources would best help an investigator confirm exactly which user account was used to log into a server at a specific time, including whether the login succeeded or failed?", "choices": ["Authentication logs", "A network diagram", "A risk register", "A business impact analysis report"], "correct": 0, "explanation": "Authentication logs record login attempts, including the account used, timestamp, source, and success or failure, making them a primary data source for confirming who accessed a system and when.", "resource": {"label": "Log Data Sources (SY0-701 4.8)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "4.0 Security Operations", "question": "An organization's new-hire onboarding process includes a mandatory training session covering how to recognize phishing emails, proper password practices, and how to report suspicious activity. What is the main goal of this training?", "choices": ["To satisfy a backup retention requirement", "To reduce human-related security risk by building awareness of common threats", "To fulfill a penetration testing requirement", "To configure the new employee's firewall rules"], "correct": 1, "explanation": "Security awareness training aims to reduce the human element of risk by teaching employees to recognize and appropriately respond to common threats like phishing, which remain one of the most common initial attack vectors.", "resource": {"label": "Security Awareness (SY0-701 5.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A document recommends that employees use a password manager but does not require it as a mandatory rule. What type of governance document is this?", "choices": ["A guideline", "A standard", "A policy", "A law"], "correct": 0, "explanation": "A guideline offers recommended best practices that are not strictly mandatory, giving flexibility in how they're followed, in contrast to a standard, which specifies mandatory, specific requirements.", "resource": {"label": "Security Governance (SY0-701 5.1)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "After identifying that an unpatched vulnerability poses significant risk, an organization applies the vendor's security patch to close the hole. What risk management strategy does this represent?", "choices": ["Risk mitigation", "Risk transference", "Risk avoidance", "Risk acceptance"], "correct": 0, "explanation": "Risk mitigation reduces the likelihood or impact of a risk through direct action, such as applying a patch, implementing a control, or improving a process, rather than eliminating the activity entirely or shifting the risk elsewhere.", "resource": {"label": "Risk Management (SY0-701 5.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A company determines that the cost of fully addressing a very low-impact, low-likelihood risk would exceed the potential loss from the risk itself, so it formally documents the risk and takes no further action. What risk management strategy is this?", "choices": ["Risk acceptance", "Risk avoidance", "Risk transference", "Risk mitigation"], "correct": 0, "explanation": "Risk acceptance acknowledges a risk and consciously decides to take no additional action, typically because the cost of addressing it outweighs the potential impact, while still documenting the decision for accountability.", "resource": {"label": "Risk Management (SY0-701 5.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A single security incident is expected to cause $20,000 in damage, and historical data suggests this type of incident occurs about once every four years, meaning an ARO of 0.25. What is the annualized loss expectancy?", "choices": ["$2,000", "$5,000", "$20,000", "$80,000"], "correct": 1, "explanation": "Annualized loss expectancy (ALE) equals Single Loss Expectancy (SLE) multiplied by Annualized Rate of Occurrence (ARO): $20,000 x 0.25 = $5,000 per year.", "resource": {"label": "Risk Analysis (SY0-701 5.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "An organization defines the maximum level of risk it is willing to accept in pursuit of its objectives, which then guides decisions about which risks require mitigation versus acceptance. What is this called?", "choices": ["Risk appetite", "A risk register", "A service level agreement", "Attestation"], "correct": 0, "explanation": "Risk appetite (or risk tolerance) is the amount of risk an organization is willing to accept in pursuit of its goals, and it serves as a benchmark for deciding whether a given risk needs further treatment or can be accepted as-is.", "resource": {"label": "Risk Management (SY0-701 5.2)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A company's own internal audit team, rather than an outside firm, reviews the IT department's compliance with internal security policies and reports findings directly to leadership. What is this process called?", "choices": ["An internal audit", "An external audit", "A penetration test", "A tabletop exercise"], "correct": 0, "explanation": "An internal audit is conducted by an organization's own staff (often an internal audit function) to assess compliance with internal policies and controls, providing ongoing oversight between less frequent external audits.", "resource": {"label": "Audits and Assessments (SY0-701 5.5)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A merchant that processes credit card payments completes and signs a formal document each year confirming it meets all applicable PCI DSS requirements. What is this document called?", "choices": ["An attestation of compliance", "A memorandum of understanding", "A business partnership agreement", "A risk register"], "correct": 0, "explanation": "An attestation of compliance is a formal declaration, often required annually under PCI DSS, confirming that an organization has met the specific security requirements of a standard or regulation.", "resource": {"label": "Compliance (SY0-701 5.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "Before sharing proprietary threat intelligence with a security vendor, a company requires the vendor to sign a document legally obligating them not to disclose the shared information to any third party. What is this document called?", "choices": ["A non-disclosure agreement (NDA)", "A service level agreement (SLA)", "A memorandum of understanding (MOU)", "A risk register"], "correct": 0, "explanation": "A non-disclosure agreement (NDA) is a legally binding contract that obligates a party to keep specified information confidential and not share it with unauthorized third parties.", "resource": {"label": "Agreement Types (SY0-701 5.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A large enterprise signs an overarching contract with a long-term vendor that establishes general terms, pricing, and legal conditions governing all future individual purchase orders between the two companies. What is this called?", "choices": ["A master service agreement (MSA)", "A non-disclosure agreement", "A memorandum of understanding", "An SLA only"], "correct": 0, "explanation": "A master service agreement establishes the overarching legal and business terms that will govern a long-term vendor relationship, under which individual statements of work or orders can be issued without renegotiating the base terms each time.", "resource": {"label": "Agreement Types (SY0-701 5.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "Two companies that are jointly launching a co-branded product sign an agreement defining how profits, responsibilities, and liabilities will be shared between them. What is this type of agreement called?", "choices": ["A business partnership agreement (BPA)", "A non-disclosure agreement", "A service level agreement", "A memorandum of understanding"], "correct": 0, "explanation": "A business partnership agreement (BPA) defines the terms of a business relationship between partners, including how responsibilities, profits, and liabilities are divided, distinct from a simple service-level contract.", "resource": {"label": "Agreement Types (SY0-701 5.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A company's contract with a critical cloud vendor includes a clause allowing the company to send its own auditors to review the vendor's security controls directly. What is this clause called?", "choices": ["A right-to-audit clause", "A non-disclosure agreement", "A service level agreement", "An attestation of compliance"], "correct": 0, "explanation": "A right-to-audit clause grants a customer the contractual ability to inspect or audit a vendor's security practices and controls directly, providing assurance beyond simply trusting the vendor's own self-reported compliance.", "resource": {"label": "Third-Party Risk Management (SY0-701 5.3)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A multinational company must ensure that European customer data is stored and processed only within data centers physically located in the European Union, per local regulation. What concept does this reflect?", "choices": ["Data sovereignty", "Data masking", "Tokenization", "Risk transference"], "correct": 0, "explanation": "Data sovereignty refers to the concept that data is subject to the laws of the country or region in which it is physically stored or collected, which often requires organizations to keep certain data within specific geographic boundaries.", "resource": {"label": "Compliance (SY0-701 5.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A U.S.-based company that handles personal data of European Union citizens must comply with a specific EU regulation governing data protection and privacy, regardless of where the company itself is headquartered. Which regulation is this?", "choices": ["GDPR", "HIPAA", "PCI DSS", "FERPA"], "correct": 0, "explanation": "The General Data Protection Regulation (GDPR) governs the protection and privacy of personal data belonging to individuals in the European Union, and it applies to any organization processing that data, regardless of where the organization is based.", "resource": {"label": "Compliance (SY0-701 5.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A healthcare organization is found to have violated HIPAA's requirements for protecting patient data. What is a likely consequence of this non-compliance?", "choices": ["Regulatory fines and legal penalties", "An automatic increase in cyber insurance coverage", "Mandatory promotion of the compliance officer", "No consequence, since HIPAA is voluntary"], "correct": 0, "explanation": "Failing to comply with a legally mandated regulation like HIPAA can result in significant financial fines, legal action, and reputational damage, since regulatory requirements (unlike voluntary guidelines) carry legal enforcement.", "resource": {"label": "Compliance (SY0-701 5.4)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "After running a simulated phishing campaign, a security team measures what percentage of employees clicked the malicious link versus reported it. What is this metric primarily used for?", "choices": ["Determining employee salaries", "Measuring and improving the effectiveness of security awareness training", "Setting firewall rules", "Calculating annualized loss expectancy"], "correct": 1, "explanation": "Click-rate and report-rate metrics from simulated phishing campaigns help an organization measure how effective its security awareness training is and identify groups that may need additional, targeted training.", "resource": {"label": "Security Awareness (SY0-701 5.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A company provides additional, more detailed security awareness training specifically to its finance department, since they are frequently targeted by business email compromise attempts. What awareness concept does this reflect?", "choices": ["Role-based awareness training", "A risk register", "A memorandum of understanding", "Data sovereignty"], "correct": 0, "explanation": "Role-based awareness training tailors security education to the specific risks faced by a particular job function, recognizing that finance, executive, or IT staff may be targeted differently than the general workforce.", "resource": {"label": "Security Awareness (SY0-701 5.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "As part of new-hire onboarding, every employee must complete a security awareness module and acknowledge the acceptable use policy before receiving system access. What governance concept does requiring this acknowledgment support?", "choices": ["Ensuring employees understand and agree to policy before being granted access", "Eliminating the need for any future training", "Replacing the need for a formal security policy", "Serving as a compensating control for encryption"], "correct": 0, "explanation": "Requiring new employees to complete training and formally acknowledge policies helps ensure they understand expectations from day one and creates a documented record of that understanding, supporting the broader security governance program.", "resource": {"label": "Security Awareness (SY0-701 5.6)", "url": "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/"}}, {"domain": "5.0 Security Program Management and Oversight", "question": "A company that self-certifies its own compliance with an internal security framework, without ever bringing in an outside party to verify the claim, relies entirely on what type of assessment?", "choices": ["A self-assessment", "An external audit", "A right-to-audit clause", "A penetration test"], "correct": 0, "explanation": "A self-assessment is conducted internally by the organization itself and, while useful for ongoing monitoring, generally carries less independent assurance than an external audit performed by an objective third par   { d:"1", obj:"1.2", q:"Employees must have a token (card) to get into certain areas. Which physical control is this?", a:"Access badges", w:["Access control vestibules","Video surveillance","Fencing"], why:"The badge is the token. Vestibules control the flow of people; they don't need a token by definition." },

  { d:"1", obj:"1.2", q:"Which Zero Trust component defines and manages the security policies that dictate access?", a:"Policy administrator", w:["Authentication server","Policy enforcement point","Client host"], why:"The policy administrator manages the policies the policy engine uses. The PEP enforces decisions." },

  { d:"2", obj:"2.2", q:"A finance manager gets an email naming a recent project, appearing to come from a known vendor, with a malware invoice. Attack?", a:"Spear phishing", w:["Whaling","Business email compromise","Watering hole"], why:"Specific to a small group = spear phishing. BEC aims to get money or data sent directly." },

  { d:"2", obj:"2.3", q:"A malicious script runs in a visitor's browser and sends their cookies and session tokens to an attacker. Vulnerability?", a:"Cross-site scripting (XSS)", w:["CSRF","SQL injection","Buffer overflow"], why:"XSS runs script in the browser. CSRF tricks the browser into sending requests." },

  { d:"2", obj:"2.3", q:"MOST effective defense against VM escape reaching the host's memory?", a:"Monitor and promptly patch the hypervisor", w:["Encrypt data inside the VM","Install antivirus on each VM","Rotate VM passwords frequently"], why:"VM escape exploits the hypervisor, so the hypervisor is what you harden." },
