": "Video Teleconferencing"}, {"a": "WAF", "e": "Web Application Firewall"}, {"a": "WAP", "e": "Wireless Access Point"}, {"a": "WEP", "e": "Wired Equivalent Privacy"}, {"a": "WIDS", "e": "Wireless Intrusion Detection System"}, {"a": "WIPS", "e": "Wireless Intrusion Prevention System"}, {"a": "WO", "e": "Work Order"}, {"a": "WPA", "e": "Wi-Fi Protected Access"}, {"a": "WPA2", "e": "Wi-Fi Protected Access 2"}, {"a": "WPA3", "e": "Wi-Fi Protected Access 3"}, {"a": "WPS", "e": "Wi-Fi Protected Setup"}, {"a": "WTLS", "e": "Wireless TLS"}, {"a": "XDR", "e": "Extended Detection and Response"}, {"a": "XML", "e": "Extensible Markup Language"}, {"a": "XOR", "e": "Exclusive OR"}, {"a": "XSRF", "e": "Cross-Site Request Forgery"}, {"a": "XSS", "e": "Cross-Site Scripting"}];
</script>
<script>
(function(){
  const app = document.getElementById("app");
  const STORAGE_KEY = "game-progress";

  const NODES = [
    { id: "d1", title: "Concepts Outpost", icon: "\u{1F6E1}\uFE0F", domain: "1.0 General Security Concepts", weight: 12 },
    { id: "d2", title: "Threat Frontier", icon: "\u{1F9A0}", domain: "2.0 Threats, Vulnerabilities, and Mitigations", weight: 22 },
    { id: "d3", title: "Architecture Citadel", icon: "\u{1F3F0}", domain: "3.0 Security Architecture", weight: 18 },
    { id: "d4", title: "Operations Grid", icon: "\u2699\uFE0F", domain: "4.0 Security Operations", weight: 28 },
    { id: "d5", title: "Governance Tower", icon: "\u{1F4DC}", domain: "5.0 Security Program Management and Oversight", weight: 20 },
    { id: "acr", title: "Cipher Vault", icon: "\u{1F510}", domain: "ACRONYMS", weight: null }
  ];

  const MISSION_LENGTH = 10;
  const QUESTION_TIME = 20;
  const INTEGRITY_START = 100;
  const INTEGRITY_LOSS = 25;
  const BOSS_LENGTH = 20;
  const BOSS_HEARTS = 3;
  const BOSS_TIME = 15;

  let state = { view: "map", progress: { stars: {}, xp: 0, bossStars: 0 } };

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function finalize(rawList){
    return shuffle(rawList).map(q => {
      const order = shuffle(q.choices.map((c,i)=>i));
      return {
        domain: q.domain, question: q.question, explanation: q.explanation, resource: q.resource,
        choices: order.map(i=>q.choices[i]), correctIndex: order.indexOf(q.correct)
      };
    });
  }

  function acronymQuestions(count){
    const pool = shuffle(ACRONYM_BANK).slice(0, count);
    return pool.map(item => {
      const distractors = shuffle(ACRONYM_BANK.filter(x=>x.a!==item.a)).slice(0,3).map(x=>x.e);
      const choices = shuffle([item.e, ...distractors]);
      return {
        domain: "Acronyms",
        question: `What does the acronym "${item.a}" stand for?`,
        choices: choices, correct: choices.indexOf(item.e),
        explanation: `${item.a} stands for ${item.e}.`,
        resource: { label: `"${item.a}" in the SY0-701 course glossary`, url: "https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/" }
      };
    });
  }

  function missionQuestions(node){
    if (node.domain === "ACRONYMS") return finalize(acronymQuestions(MISSION_LENGTH));
    const pool = QUESTION_BANK.filter(q => q.domain === node.domain);
    return finalize(shuffle(pool).slice(0, Math.min(MISSION_LENGTH, pool.length)));
  }

  function bossQuestions(){
    const counts = { "1.0 General Security Concepts":3, "2.0 Threats, Vulnerabilities, and Mitigations":5,
      "3.0 Security Architecture":4, "4.0 Security Operations":5, "5.0 Security Program Management and Oversight":3 };
    let combined = [];
    Object.keys(counts).forEach(dk => {
      const pool = shuffle(QUESTION_BANK.filter(q=>q.domain===dk));
      combined = combined.concat(pool.slice(0, counts[dk]));
    });
    combined = combined.concat(acronymQuestions(BOSS_LENGTH - combined.length));
    return finalize(combined);
  }

  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error("storage call timed out")), ms))
    ]);
  }

  async function loadProgress(){
    let raw = null;
    if (window.storage){
      try {
        const res = await withTimeout(window.storage.get(STORAGE_KEY, false), 4000);
        raw = res ? res.value : null;
      } catch(e){
        console.info("Using local backup for progress (sync unavailable or slow this session)", e);
        try { raw = localStorage.getItem(STORAGE_KEY); } catch(e2){ raw = null; }
      }
    } else {
      try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){ raw = null; }
    }
    try {
      state.progress = raw ? JSON.parse(raw) : { stars: {}, xp: 0, bossStars: 0 };
    } catch(e){
      state.progress = { stars: {}, xp: 0, bossStars: 0 };
    }
  }

  async function saveProgress(){
    const payload = JSON.stringify(state.progress);
    // Always write to localStorage as a same-device safety net, regardless of window.storage outcome.
    try { localStorage.setItem(STORAGE_KEY, payload); } catch(e){ /* ignore, best-effort */ }

    if (!window.storage) return;
    const attempts = 2;
    for (let i = 0; i < attempts; i++){
      try {
        await withTimeout(window.storage.set(STORAGE_KEY, payload, false), 4000);
        return;
      } catch(e){
        if (i === attempts - 1){
          console.info("Progress saved locally; sync unavailable or slow this session", e);
        } else {
          await new Promise(r => setTimeout(r, 400));
        }
      }
    }
  }

  function bossUnlocked(){
    return NODES.every(n => (state.progress.stars[n.id] || 0) >= 1);
  }

  function topBar(extra){
    return `
      <div class="top-bar">
        <div class="logo">
          <span class="tag">SY0-701 // ARCADE MODE</span>
          <h1>Sec+ Defender</h1>
        </div>
        <div class="stat-strip">
          <div class="stat-chip">\u26A1 <b>${state.progress.xp}</b> XP</div>
          ${extra || ""}
        </div>
      </div>`;
  }

  function starString(n){
    let s = "";
    for (let i=1;i<=3;i++) s += `<span class="${i<=n?'filled':'empty'}">\u2605</span>`;
    return s;
  }

  function renderMap(){
    const cards = NODES.map(n => {
      const stars = state.progress.stars[n.id] || 0;
      return `
      <div class="node-card" data-node="${n.id}">
        <div class="icon">${n.icon}</div>
        <h3>${n.title}</h3>
        <div class="sub">${n.weight != null ? n.weight + "% of exam" : QUESTION_BANK.length ? "330 acronyms" : ""}</div>
        <div class="node-stars">${starString(stars)}</div>
      </div>`;
    }).join("");

    const unlocked = bossUnlocked();
    const bossStars = state.progress.bossStars || 0;

    app.innerHTML = `
      ${topBar()}
      <p class="g-explain" style="border-color:var(--line);">Clear each zone to earn stars \u2014 answer fast and accurately to build combo streaks. Every run pulls a fresh random set of questions, so replaying stays interesting. Beat all six zones to unlock the Final Boss.</p>
      <div class="map-grid">${cards}</div>
      <div class="boss-card ${unlocked ? "" : "locked"}" id="boss-card">
        <div style="font-size:30px;">\u{1F480}</div>
        <h2>FINAL BOSS: The Breach</h2>
        <div class="sub">${unlocked ? `20 mixed questions \u00b7 3 hearts only \u00b7 15s per question ${bossStars ? "\u00b7 " + "\u2605".repeat(bossStars) : ""}` : "Locked \u2014 earn at least 1 star in every zone to unlock"}</div>
      </div>
      <div class="companion-note">Prefer a calmer, untimed study format? The Practice Console (separate file) covers the same material with full exam mode, domain drills, and a review-focused layout \u2014 this Arcade Mode is just a different way to drill the same content.</div>
      <div class="footer-note">Progress saves automatically. Original practice content \u2014 not reproduced from any copyrighted exam prep material.</div>
    `;

    app.querySelectorAll(".node-card").forEach(el => {
      el.addEventListener("click", () => startMission(el.getAttribute("data-node")));
    });
    const bossEl = document.getElementById("boss-card");
    if (unlocked) bossEl.addEventListener("click", startBoss);
  }

  function startMission(nodeId){
    const node = NODES.find(n => n.id === nodeId);
    state.view = "mission";
    state.mission = {
      node, isBoss: false,
      questions: missionQuestions(node),
      index: 0, answered: false, selected: null,
      integrity: INTEGRITY_START, streak: 0, bestStreak: 0, score: 0, correctCount: 0,
      answers: [], timer: null, timeLeft: QUESTION_TIME
    };
    render();
    startQuestionTimer();
  }

  function startBoss(){
    state.view = "mission";
    state.mission = {
      node: { id: "boss", title: "The Breach", icon: "\u{1F480}" }, isBoss: true,
      questions: bossQuestions(),
      index: 0, answered: false, selected: null,
      hearts: BOSS_HEARTS, streak: 0, bestStreak: 0, score: 0, correctCount: 0,
      answers: [], timer: null, timeLeft: BOSS_TIME
    };
    render();
    startQuestionTimer();
  }

  function clearTimer(){
    const m = state.mission;
    if (m && m.timer){ clearInterval(m.timer); m.timer = null; }
  }

  function startQuestionTimer(){
    const m = state.mission;
    const limit = m.isBoss ? BOSS_TIME : QUESTION_TIME;
    m.timeLeft = limit;
    clearTimer();
    m.timer = setInterval(() => {
      m.timeLeft -= 1;
      const fill = document.getElementById("timer-fill");
      if (fill){
        fill.style.width = Math.max(0, (m.timeLeft/limit)*100) + "%";
        fill.classList.toggle("low", m.timeLeft <= 5);
      }
      if (m.timeLeft <= 0){
        clearTimer();
        if (!m.answered) handleAnswer(-1, true);
      }
    }, 1000);
  }

  function handleAnswer(choiceIndex, timedOut){
    const m = state.mission;
    if (m.answered) return;
    clearTimer();
    const q = m.questions[m.index];
    const correct = choiceIndex === q.correctIndex;
    m.answered = true;
    m.selected = choiceIndex;

    if (correct){
      m.streak += 1;
      m.bestStreak = Math.max(m.bestStreak, m.streak);
      m.correctCount += 1;
      const mult = 1 + Math.min(m.streak-1, 5) * 0.2;
      m.score += Math.round(100 * mult);
    } else {
      m.streak = 0;
      if (m.isBoss) m.hearts -= 1;
      else m.integrity = Math.max(0, m.integrity - INTEGRITY_LOSS);
    }
    m.answers.push({ domain: q.domain, correct, question: q.question, explanation: q.explanation, resource: q.resource,
      chosen: timedOut ? "(no answer \u2014 time expired)" : q.choices[choiceIndex], correctChoice: q.choices[q.correctIndex] });

    render();

    const breached = m.isBoss ? m.hearts <= 0 : m.integrity <= 0;
    setTimeout(() => {
      if (breached){ finishMission(true); return; }
      if (m.index + 1 >= m.questions.length){ finishMission(false); return; }
      m.index += 1; m.answered = false; m.selected = null;
      render();
      startQuestionTimer();
    }, 1400);
  }

  function renderMission(){
    const m = state.mission;
    const q = m.questions[m.index];
    const total = m.questions.length;
    const limit = m.isBoss ? BOSS_TIME : QUESTION_TIME;

    const choicesHtml = q.choices.map((choice,i) => {
      let cls = "g-choice";
      if (m.answered){
        if (i === q.correctIndex) cls += " correct";
        else if (i === m.selected) cls += " incorrect";
      }
      return `<button class="${cls}" data-i="${i}" ${m.answered ? "disabled" : ""}><span class="letter">${String.fromCharCode(65+i)}</span>${choice}</button>`;
    }).join("");

    let feedback = "";
    if (m.answered){
      const wasRight = m.selected === q.correctIndex;
      feedback = `<div class="g-explain ${wasRight?'right':'wrong'}">${wasRight ? "\u2705 Correct" : "\u274C Incorrect"} \u2014 ${q.explanation}</div>`;
    }

    const statusHtml = m.isBoss
      ? `<div class="hearts">${"\u2764\uFE0F".repeat(Math.max(0,m.hearts))}${"\u{1F494}".repeat(Math.max(0, BOSS_HEARTS - m.hearts))}</div>`
      : `<div class="integrity-wrap"><span class="integrity-label">INTEGRITY</span><div class="integrity-track"><div class="integrity-fill" style="width:${m.integrity}%"></div></div><span class="integrity-label">${m.integrity}%</span></div>`;

    app.innerHTML = `
      ${topBar(`<div class="stat-chip">\u{1F525} <b>${m.streak}</b> streak</div><div class="stat-chip">${m.score} pts</div>`)}
      <div class="mission-meta"><span>${m.node.icon} ${m.node.title}</span><span>Q ${m.index+1}/${total}</span></div>
      ${statusHtml}
      <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:${(m.timeLeft/limit)*100}%"></div></div>
      <div class="q-card">
        ${m.answered && m.selected===q.correctIndex && m.streak>1 ? `<div class="combo-pop">+COMBO x${m.streak}</div>` : ""}
        <div class="q-text">${q.question}</div>
        ${choicesHtml}
        ${feedback}
      </div>
      <div class="btn-row"><button class="btn btn-ghost" id="quit-mission">Retreat to map</button></div>
    `;

    if (!m.answered){
      app.querySelectorAll(".g-choice").forEach(btn => {
        btn.addEventListener("click", () => handleAnswer(parseInt(btn.getAttribute("data-i"),10), false));
      });
    }
    document.getElementById("quit-mission").addEventListener("click", () => {
      clearTimer();
      state.view = "map";
      render();
    });
  }

  async function finishMission(breached){
    const m = state.mission;
    clearTimer();
    const pct = m.correctCount / m.questions.length;

    if (m.isBoss){
      let stars = breached ? 0 : (pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : 1);
      state.progress.bossStars = Math.max(state.progress.bossStars || 0, stars);
      state.progress.xp += m.score;
      await saveProgress();
      state.view = "bossResult";
      state.result = { breached, stars, score: m.score, correctCount: m.correctCount, total: m.questions.length, bestStreak: m.bestStreak, answers: m.answers };
    } else {
      let stars = breached ? 0 : (pct >= 0.9 && m.integrity >= 75 ? 3 : pct >= 0.7 ? 2 : 1);
      const prev = state.progress.stars[m.node.id] || 0;
      state.progress.stars[m.node.id] = Math.max(prev, stars);
      state.progress.xp += m.score;
      await saveProgress();
      state.view = "missionResult";
      state.result = { breached, stars, score: m.score, correctCount: m.correctCount, total: m.questions.length, bestStreak: m.bestStreak, node: m.node, answers: m.answers };
    }
    render();
  }

  function renderResult(isBoss){
    const r = state.result;
    const reviewHtml = r.answers.map(a => `
      <div class="review-item">
        <span class="review-tag ${a.correct?'right':'wrong'}">${a.correct?'HIT':'MISS'}</span>${a.question}
        <div class="g-explain ${a.correct?'right':'wrong'}" style="margin-top:6px;">
          ${a.correct ? "" : `Correct answer: ${a.correctChoice}<br>`}${a.explanation}
          <div style="margin-top:6px;"><a href="${a.resource.url}" target="_blank" rel="noopener">\u203A ${a.resource.label}</a></div>
        </div>
      </div>`).join("");

    app.innerHTML = `
      ${topBar()}
      <div class="q-card">
        <div class="result-hero">
          <div class="result-title ${r.breached ? 'breach' : 'win'}">${r.breached ? (isBoss ? "\u{1F480} SYSTEM BREACHED" : "\u26A0\uFE0F ZONE BREACHED") : (isBoss ? "\u{1F3C6} BOSS DEFEATED" : "\u2705 ZONE CLEARED")}</div>
          <div class="result-stars">${starString(r.stars)}</div>
          <div class="result-sub">${r.correctCount}/${r.total} correct \u00b7 ${r.score} pts \u00b7 best streak x${r.bestStreak}</div>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="map-btn">Back to map</button>
          <button class="btn btn-accent" id="retry-btn">${r.breached ? "Try again" : "Replay for more stars"}</button>
        </div>
      </div>
      <div class="q-card">
        <h3 style="margin-top:0;">Debrief</h3>
        ${reviewHtml}
      </div>
    `;
    document.getElementById("map-btn").addEventListener("click", () => { state.view = "map"; render(); });
    document.getElementById("retry-btn").addEventListener("click", () => {
      if (isBoss) startBoss(); else startMission(r.node.id);
    });
  }

  function render(){
    if (state.view === "map") renderMap();
    else if (state.view === "mission") renderMission();
    else if (state.view === "missionResult") renderResult(false);
    else if (state.view === "bossResult") renderResult(true);
  }

  (async function init(){
    app.innerHTML = `${topBar()}<div class="q-card">Loading your progress\u2026</div>`;
    await loadProgress();
    render();
  })();
})();

</script>
</body>
</html>
